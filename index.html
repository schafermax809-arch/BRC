 return `<div class="narrow"><div class="quiz-meta"><span>${topicName(q.topic)}</span><span>Frage ${quiz.index+1} von ${quiz.items.length}</span></div>${progress((quiz.index)/quiz.items.length*100)}<section class="panel quiz-card" style="margin-top:18px"><div class="eyebrow">EINE ANTWORT IST RICHTIG</div><h2>${q.prompt}</h2><div class="options">${item.order.map((ix,i)=>`<button class="option ${done&&ix===q.correct?'correct':''} ${done&&ix===item.chosen&&!correct?'wrong':''}" data-action="answer" data-index="${ix}" ${done?'disabled':''}><span class="key">${i+1}</span><span>${q.options[ix]}${done&&ix===q.correct?' <span class="success">✓ Richtig</span>':''}${done&&ix===item.chosen&&!correct?' <span class="failure">× Deine Antwort</span>':''}</span></button>`).join('')}</div>${done?`<div class="feedback ${correct?'':'bad'}" role="status"><h3>${correct?'Richtig.':'Noch nicht ganz.'}</h3><p>${q.explanation}</p><a class="text-link" href="#lernen/${q.lesson}">Im Lernstoff nachlesen →</a></div>`:''}<div class="action-row"><button class="text-link" data-action="end-quiz">Runde beenden</button>${done?button(quiz.index===quiz.items.length-1?'Auswertung ansehen':'Nächste Frage →','next-question'):'<span class="small muted">Tastatur: 1–4</span>'}</div></section></div>`;
}
function startQuiz(topic='all',count=10,ids=null){let pool=questions.filter(q=>(topic==='all'||q.topic===topic)&&(!ids||ids.includes(q.id)));if(!pool.length){toast('Keine Fehler offen. Starte eine neue Lernrunde.');return;}quiz={items:shuffle(pool).slice(0,count).map(q=>({id:q.id,order:shuffle([0,1,2,3]),chosen:null})),index:0,results:[]};practiceTab='quiz';navigate('ueben');}
function answerQuestion(ix){const item=quiz?.items[quiz.index];if(!item||item.chosen!==null)return;const q=questions.find(q=>q.id===item.id);item.chosen=ix;const correct=ix===q.correct;quiz.results.push({id:q.id,correct});state.answers[q.id]={correct,attempts:(state.answers[q.id]?.attempts||0)+1};save();render();}
function calcPractice(){const q=calculations[calcIndex];return `<div class="exercise-grid"><div class="exercise-list" aria-label="Rechenaufgaben">${calculations.map((x,i)=>`<button class="${i===calcIndex?'active':''}" data-action="calc-question" data-index="${i}"><span>${String(i+1).padStart(2,'0')} ${state.calculations[x.id]?'· Richtig gelöst':''}</span>${x.title}</button>`).join('')}</div><section class="panel"><div class="eyebrow">RECHENAUFGABE ${calcIndex+1} / ${calculations.length}</div><h2 style="margin-top:15px">${q.title}</h2><p class="exercise-prompt">${q.prompt}</p><form id="calc-answer-form"><div class="answer-row"><label>Dein Ergebnis in ${q.unit}<input id="calc-answer" inputmode="decimal" type="text" autocomplete="off" placeholder="z. B. 1.250,50" required value="${esc(calcFeedback?.value||'')}"></label>${button('Prüfen','check-calc','type="submit"')}</div></form>${calcFeedback?`<div class="feedback ${calcFeedback.correct?'':'bad'}" role="status"><h3>${calcFeedback.correct?'Richtig gerechnet.':'Prüfe deinen Rechenweg.'}</h3><p>${calcFeedback.correct?'Das Ergebnis stimmt. Unten kannst du den Lösungsweg vergleichen.':'Prüfe die gesuchte Größe und die Einheit. Unter „Ansatz zeigen“ findest du die passende Formel. Du kannst es erneut versuchen.'}</p></div>`:''}<details><summary>Ansatz zeigen</summary><p>${q.steps[0]}</p></details><details ${calcFeedback?.correct?'open':''}><summary>Lösungsweg ansehen</summary><div>${q.steps.map(s=>`<p>${s}</p>`).join('')}<p><strong>Ergebnis: ${fmt(q.answer,Number.isInteger(q.answer)?0:2)} ${q.unit}</strong></p></div></details><div class="action-row"><a href="#lernen/${q.lesson}" class="text-link">Dazugehörigen Lernstoff öffnen →</a>${button('Nächste Aufgabe','next-calc','','secondary')}</div></section></div>`;}
function casePractice(){const c=cases[caseIndex];return `<div class="exercise-grid"><div class="exercise-list" aria-label="Fallaufgaben">${cases.map((x,i)=>`<button class="${i===caseIndex?'active':''}" data-action="case-question" data-index="${i}"><span>${topicName(x.topic)}</span>${x.title}</button>`).join('')}</div><section class="panel"><div class="eyebrow">ANWENDEN & BEGRÜNDEN</div><h2 style="margin-top:15px">${c.title}</h2><p class="exercise-prompt">${c.prompt}</p><label>Deine Antwort<textarea id="case-answer" data-id="${c.id}" placeholder="Nenne dein Konzept und begründe es am Fall. Wäge auch einen Nachteil ab.">${esc(state.drafts[c.id]||'')}</textarea></label><div class="action-row">${button(caseOpen?'Erwartungshorizont ausblenden':'Mit Erwartungshorizont vergleichen','case-solution','','secondary')}</div>${caseOpen?`<div class="feedback"><h3>Selbstcheck · Was deckt deine Antwort ab?</h3><div class="rubric">${c.rubric.map((r,i)=>`<label class="check-label"><input type="checkbox" data-case-check="${c.id}-${i}">${r}</label>`).join('')}</div><p class="small muted">Die Häkchen sind deine eigene Einschätzung. Deine Formulierung muss nicht genauso lauten.</p><details><summary>Mögliche Antwort</summary><p>${c.sample}</p></details></div>`:''}</section></div>`;}
function flashcards(){
 if(!deck)return head('WIEDERHOLUNG MIT ABSTAND','Karteikarten.','Lies die Frage, antworte kurz im Kopf und decke dann die Lösung auf.')+`<div class="narrow panel"><h2>${cards.length} Karten zu deinem Stoff.</h2><p class="muted" style="margin-top:14px">„Nochmal“ legt eine Karte in 10 Minuten vor. „Fast“ plant sie für morgen, „Sicher“ in drei Tagen. Alles bleibt auf diesem Gerät.</p><div class="form-grid"><label>Schwerpunkt<select id="card-topic">${topicOptions()}</select></label><label>Auswahl<select id="card-mode"><option value="due">Neue & fällige Karten</option><option value="all">Alle Karten</option></select></label></div>${button('Karten starten','start-cards')}</div>`;
 if(deck.index>=deck.items.length)return head('KARTEIKARTEN','Runde geschafft.')+`<div class="narrow empty"><h2>${deck.items.length} Karten wiederholt.</h2><p>Deine Einschätzungen sind gespeichert. Du kannst später mit den fälligen Karten weitermachen.</p>${button('Neue Auswahl','reset-cards')}</div>`;
 const c=cards.find(x=>x.id===deck.items[deck.index]);return head('KARTEIKARTEN',topicName(c.topic))+`<div class="narrow"><div class="quiz-meta"><span>${c.context}</span><span>${deck.index+1} / ${deck.items.length}</span></div>${progress(deck.index/deck.items.length*100)}<button class="panel flashcard ${deck.reveal?'revealed':''}" data-action="flip" aria-expanded="${deck.reveal}" style="margin-top:20px"><span class="eyebrow">${deck.reveal?'VERGLEICHE DEINE ANTWORT':'DEINE FRAGE'}</span><h2>${c.question}</h2>${deck.reveal?`<p class="card-answer">${c.answer}</p>`:'<span class="flip-hint">Kurz beantworten · dann antippen oder Leertaste drücken</span>'}</button>${deck.reveal?`<div class="card-actions">${button('Nochmal · 10 Min.','rate-card','data-days="0"','secondary')}${button('Fast · 1 Tag','rate-card','data-days="1"','secondary')}${button('Sicher · 3 Tage','rate-card','data-days="3"')}</div>`:''}<div class="action-row"><button class="text-link" data-action="reset-cards">Auswahl ändern</button><a class="text-link" href="#lernen/${c.lesson}">Kapitel nachlesen →</a></div></div>`;
}
function eoqCalculator(){const d=calcData;calcOutput=validateInputs(d)?{raw:eoq(d),q:Math.min(eoq(d),d.J)}:null;return head('ZUSAMMENHÄNGE VERSTEHEN','Das Rechenlabor.','Ändere die Werte und vergleiche Formel, Kostenkurven und Entscheidungstabelle.')+`<div class="calculator-layout"><form id="calculator-form" class="panel calc-form"><label class="preset-label">Beispiel<select id="calc-preset">${Object.entries(presets).map(([id,p])=>`<option value="${id}" ${preset===id?'selected':''}>${p.name}</option>`).join('')}</select></label><div class="form-grid">${[['J','Jahresbedarf J',d.unit],['B','Kosten je Bestellung B','€'],['p','Einstandspreis p',`€/${d.unit}`],['i','Lagerkostensatz i','% pro Jahr'],['M','Mindestbestand M',d.unit]].map(([id,label,unit])=>`<label>${label}<input type="text" inputmode="decimal" id="input-${id}" value="${String(d[id]).replace('.',',')}" required ${preset==='oil'&&id==='p'?'readonly':''}><span class="field-help">${unit}</span></label>`).join('')}</div>${button('Berechnen','calculate','type="submit"')}<p class="field-help">Dezimalzahlen mit Komma, z. B. 10,60. ${preset==='oil'?'Rabattstaffel: 10 % ab 4.000 l; 12 % ab 6.000 l; 15 % ab 20.000 l.':''}</p><div id="calc-error" class="error" role="alert"></div></form><div id="calc-results">${calcResults()}</div></div><section style="margin-top:28px"><div class="section-heading"><h2>Entscheidungstabelle</h2><span class="small muted">Kosten pro Jahr</span></div><div id="calc-table">${calcTable()}</div></section><details><summary>Formeln & Voraussetzungen</summary><div><p>q = J / n · Ø Bestand = q / 2 + M · Ø Wert = Ø Bestand × p</p><p>Bestellkosten = n × B · Lagerhaltungskosten = Ø Wert × i / 100</p><p>Relevante Kosten = Bestellkosten + Lagerhaltungskosten</p><p>Andler: q* = √((200 × J × B) / (p × i)), mit i als Prozentzahl. Es gelten gleichmäßiger bekannter Bedarf, feste Bestellkosten und konstanter Preis. Ein konstanter Mindestbestand erhöht die Kosten, verändert bei konstantem Preis aber nicht q*. Ganzzahlige Bestellhäufigkeiten und Rabatte werden separat verglichen.</p></div></details>`;}
function calcResults(){if(!calcOutput)return '';const d=calcData,q=calcOutput.q,c=costs(d,q);if(preset==='oil'){const rows=presets.oil.frequencies.map(n=>costs(d,d.J/n,oilPrice(d.J/n)));const best=rows.reduce((a,b)=>a.relevant<b.relevant?a:b);return `<div class="panel calc-results"><div class="eyebrow">MENGENRABATT · ENTSCHEIDUNGSTABELLE</div><h2>${fmt(best.q,2)} <small>${d.unit} je Bestellung</small></h2><p class="muted" style="margin-top:12px">Günstigste der in der Mappe vorgegebenen Bestellmengen nach jährlichen Bestell- und Lagerhaltungskosten.</p><div class="metric-row"><div><strong>${eur(best.relevant)}</strong><span>Summe der beiden Kostenarten</span></div><div><strong>${eur(best.p)}</strong><span>Preis pro Liter bei dieser Bestellmenge</span></div></div><p class="source-line">Die einfache Andler-Formel setzt einen konstanten Stückpreis voraus. Bei Rabatten vergleichst du hier die Zeilen der Entscheidungstabelle.</p></div>`;}

 const sq=sliderQ||Math.round(q),selected=costs(d,sq);return `<div class="panel calc-results"><div class="eyebrow">${calcOutput.raw>d.J?'OPTIMUM MIT JAHRESBEDARF ALS OBERGRENZE':'THEORETISCHE OPTIMALE BESTELLMENGE'}</div><h2>${fmt(q,2)} <small>${d.unit} je Bestellung</small></h2><div class="formula">√(200 × ${fmt(d.J)} × ${fmt(d.B,2)} / (${fmt(d.p,2)} × ${fmt(d.i)}))</div>${calcOutput.raw>d.J?`<p class="field-help">Die Formel liefert ${fmt(calcOutput.raw,2)} ${d.unit}. Hier vergleichen wir maximal einen Jahresbedarf je Bestellung.</p>`:''}<div class="metric-row"><div><strong>${fmt(c.n,2)}</strong><span>Bestellungen pro Jahr (rechnerisch)</span></div><div><strong>${eur(c.relevant)}</strong><span>Bestell- und Lagerkosten pro Jahr</span></div></div><div id="eoq-chart">${costChart(d,q)}</div><div class="chart-legend"><span>Summe</span><span class="ordering">Bestellkosten</span><span class="holding">Lagerkosten</span></div><label class="range-label">Bestellmenge verschieben (heller Punkt): <strong id="slider-value">${fmt(sq)} ${d.unit}</strong><input type="range" id="q-slider" min="${Math.max(1,Math.floor(q*.2))}" max="${Math.max(2,Math.min(d.J,Math.ceil(q*3)))}" step="1" value="${sq}"></label><p class="small muted" id="slider-cost">Bei dieser Menge: ${eur(selected.relevant)} pro Jahr.</p></div>`;}
function costChart(d,q){const width=600,height=230,pad={l:57,r:15,t:20,b:34},min=Math.max(1,q*.2),max=Math.min(d.J,q*3);const chosen=Math.max(min,Math.min(max,sliderQ||q));const points=Array.from({length:71},(_,i)=>{const x=min+(max-min)*i/70;return costs(d,x);});const maxY=Math.max(...points.map(p=>p.relevant))*1.06;const X=x=>pad.l+(x-min)/(max-min||1)*(width-pad.l-pad.r),Y=y=>height-pad.b-y/maxY*(height-pad.t-pad.b);const path=k=>points.map((p,i)=>`${i?'L':'M'}${X(p.q).toFixed(1)},${Y(p[k]).toFixed(1)}`).join(' ');return `<svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Kostenkurven: Die Bestellkosten sinken, die Lagerkosten steigen. Die Summe hat ihr Minimum bei etwa ${fmt(q)} ${d.unit}.">${[0,.5,1].map(v=>`<line class="chart-grid" x1="${pad.l}" x2="${width-pad.r}" y1="${Y(maxY*v)}" y2="${Y(maxY*v)}"/><text x="${pad.l-8}" y="${Y(maxY*v)+4}" text-anchor="end">${fmt(maxY*v)}</text>`).join('')}<text x="${pad.l}" y="12">€ / Jahr</text>${[min,q,max].map(v=>`<text x="${X(v)}" y="${height-10}" text-anchor="middle">${fmt(v)}</text>`).join('')}<path d="${path('ordering')}" fill="none" stroke="#b3cbd6" stroke-width="2"/><path d="${path('holding')}" fill="none" stroke="#cbac81" stroke-width="2"/><path d="${path('relevant')}" fill="none" stroke="var(--accent)" stroke-width="3"/><line x1="${X(q)}" x2="${X(q)}" y1="25" y2="${height-pad.b}" stroke="var(--accent)" stroke-dasharray="3 6" opacity=".4"/><circle cx="${X(q)}" cy="${Y(costs(d,q).relevant)}" r="5" fill="var(--accent)"/><circle cx="${X(chosen)}" cy="${Y(costs(d,chosen).relevant)}" r="6" fill="var(--bg)" stroke="var(--ink)" stroke-width="2"/><text x="${width-pad.r}" y="${height+8}" text-anchor="end">Bestellmenge q (${d.unit})</text></svg>`;}
function calcTable(){const d=calcData;if(!calcOutput)return '';let ns=presets[preset].frequencies;const rows=ns.map(n=>{const q=d.J/n;return costs(d,q,preset==='oil'?oilPrice(q):d.p);});const best=Math.min(...rows.map(r=>r.relevant));return `<div class="table-wrap" tabindex="0" aria-label="Entscheidungstabelle, bei Bedarf horizontal scrollen"><table><thead><tr><th>Bestellungen<br>pro Jahr</th><th>Menge<br>${d.unit}</th>${preset==='oil'?'<th>Preis<br>€/l</th>':''}<th>Ø Bestand<br>${d.unit}</th><th>Ø Wert<br>€</th><th>Lagerkosten<br>€</th><th>Bestellkosten<br>€</th><th>Summe<br>€</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r.relevant===best?'best':''}"><td>${fmt(r.n)}${r.relevant===best?' ✓':''}</td><td>${fmt(r.q,2)}</td>${preset==='oil'?`<td>${fmt(r.p,2)}</td>`:''}<td>${fmt(r.stock,2)}</td><td>${fmt(r.value,2)}</td><td>${fmt(r.holding,2)}</td><td>${fmt(r.ordering,2)}</td><td>${fmt(r.relevant,2)}</td></tr>`).join('')}</tbody></table></div><p class="field-help">✓ Minimum innerhalb dieser Tabellenalternativen. Die Summe enthält Bestell- und Lagerhaltungskosten. Zwischenwerte bleiben intern ungerundet; angezeigte Werte sind gerundet.</p>${preset==='oil'?'<div class="notice">Bei 12.000 l gelten 12 % Rabatt. Mit den Zahlen der Mappe ergeben sich Lagerkosten von 4.576 € und eine Kostensumme von 5.076 €.</div>':''}${preset==='hinges'?'<p class="field-help">Das Arbeitsblatt verlangt aufgerundete Stückzahlen. Hier zeigt der Vergleich zunächst exakte Modellwerte. Für die Abgabe Stückzahlen nach Aufgabenvorgabe aufrunden und die Folgekosten entsprechend neu berechnen.</p>':''}`;}
const caseTasks=()=>caseExam.sections.flatMap(s=>s.tasks);
const casePoints=()=>caseTasks().reduce((n,t)=>n+t.rubric.length,0);
let caseStudySection=0,caseRevealed=new Set();
function caseValues(t,values){return [values[t.id],...(t.fields||[]).map(f=>values[t.id+'-'+f.id])];}
function caseAttempted(t,values){return caseValues(t,values).some(v=>String(v??'').trim());}
function caseAnswered(){return caseTasks().filter(t=>caseAttempted(t,exam.answers)).length;}
function caseScore(){return caseTasks().reduce((n,t)=>n+(caseAttempted(t,exam.answers)?t.rubric.filter((_,i)=>exam.self[t.id+'-'+i]).length:0),0);}
function caseIntro(){return `<section class="panel case-intro"><div class="eyebrow">NEU · FALLKLAUSUR NACH ABITUR-AUFBAU</div><h2>${caseExam.title}</h2><p>Ein Unternehmensfall, drei Anlagen und ${caseTasks().length} Teilaufgaben: vergleichen, berechnen, begründen und beurteilen.</p><div class="case-facts"><span>${caseExam.minutes} Minuten</span><span>${casePoints()} Punkte · Selbstbewertung</span><span>Mit Brutto- und Nettobedarfsrechnung</span></div><div class="action-row">${button('Fallklausur starten','start-case-exam')}${button('Ohne Zeitdruck üben','open-case-study','','secondary')}</div><p class="field-help">Eigene Aufgaben und Zahlen. Die Abitur-PDF dient als Vorlage für den Aufbau. Lösungen erscheinen in der Klausur erst nach der Abgabe.</p></section>`;}
function caseMaterials(section){return section.material.map(m=>`<details class="case-material" open><summary>${m.title}</summary><div class="table-wrap"><table class="material-table"><thead><tr>${m.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${m.rows.map(row=>`<tr>${row.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`).join('');}
function caseSolution(t,examMode){const values=examMode?exam.answers:state.drafts,attempted=caseAttempted(t,values);return `<div class="feedback case-solution"><h3>Lösung und Rechenweg</h3>${t.solution.map(s=>`<p>${s}</p>`).join('')}${t.fields?`<div class="result-list">${t.fields.map(f=>{const entered=values[t.id+'-'+f.id]??'',right=Number.isFinite(number(entered))&&Math.abs(number(entered)-f.answer)<=(f.tolerance??.01);return `<div class="result-row"><span class="${right?'success':'failure'}">${right?'✓':'×'} ${f.label}: ${esc(entered)||'Noch offen'} ${f.unit}</span><p class="small">Richtig: ${fmt(f.answer,Number.isInteger(f.answer)?0:2)} ${f.unit}</p></div>`;}).join('')}</div>`:''}<h3>Erwartungshorizont · ${t.rubric.length} Punkte</h3><p class="field-help">Je ein Punkt pro erfülltem Kriterium. Prüfe auch den Rechenweg. Ein nachvollziehbarer Folgefehler kann bei der Selbsteinschätzung berücksichtigt werden; keine verbindliche Benotung.</p>${examMode?`<div class="rubric">${t.rubric.map((r,i)=>`<label class="check-label"><input type="checkbox" data-case-self="${t.id}-${i}" ${exam.self[t.id+'-'+i]?'checked':''} ${!attempted?'disabled':''}>${r}</label>`).join('')}</div>`:`<ul>${t.rubric.map(r=>`<li>${r}</li>`).join('')}</ul>`}</div>`;}
function caseTask(t,mode){const isExam=mode==='exam',finished=isExam&&exam.finished,values=isExam?exam.answers:state.drafts,attr=isExam?'data-exam':'data-case-study';return `<article class="panel case-task"><div class="row spread"><span class="eyebrow">${t.num} · ${t.operator}</span><span class="tag">${t.rubric.length} Punkte</span></div><h3>${t.prompt}</h3>${!isExam?`<details><summary>Was wird von mir erwartet?</summary><p>${t.hint}</p></details>`:''}${finished?`<div class="user-answer">${esc(values[t.id]||'Kein schriftlicher Rechenweg / keine Begründung eingetragen.')}</div>`:`${t.fields?`<div class="form-grid case-result-fields">${t.fields.map(f=>`<label>${f.label}<input type="text" inputmode="decimal" ${attr}="${t.id}-${f.id}" value="${esc(values[t.id+'-'+f.id]??'')}"><span class="field-help">${f.unit}</span></label>`).join('')}</div>`:''}<label class="case-answer-label">${t.fields?'Dein Rechenweg und deine Erläuterung':'Deine Antwort'}<textarea ${attr}="${t.id}" placeholder="${t.fields?'Formel → Werte einsetzen → Ergebnis mit Einheit. Ergänze die geforderte Erläuterung.':'Beantworte die Teilaufgabe mit Bezug auf den Fall.'}">${esc(values[t.id]||'')}</textarea></label>`}${!isExam?`<div class="action-row">${button(caseRevealed.has(t.id)?'Lösung ausblenden':'Antwort und Rechenweg prüfen','toggle-case-answer',`data-id="${t.id}"`,'secondary')}</div>`:''}${finished||(!isExam&&caseRevealed.has(t.id))?caseSolution(t,isExam):''}</article>`;}
function caseStudy(){const s=caseExam.sections[caseStudySection];return `<div class="notice">${caseExam.note}</div><details class="case-background" open><summary>Ausgangssituation · ${caseExam.title}</summary><p>${caseExam.intro}</p></details><div class="segmented" role="group" aria-label="Aufgabenblock">${caseExam.sections.map((s,i)=>button(s.title,'case-section',`data-index="${i}" aria-pressed="${i===caseStudySection}"`,i===caseStudySection?'active':'')).join('')}</div><section class="case-section"><h2>${s.title}</h2><p class="exercise-prompt">${s.context}</p>${caseMaterials(s)}${s.tasks.map(t=>caseTask(t,'study')).join('')}</section>`;}
function startCaseExam(){exam={kind:'case',version:caseExam.id,deadline:Date.now()+caseExam.minutes*60000,answers:{},self:{},finished:false};saveExam();render();window.scrollTo(0,0);}
function caseExamView(){return head(exam.finished?'AUSWERTUNG · FALLKLAUSUR':'FALLKLAUSUR',exam.finished?(exam.timed?'Die Zeit ist um.':'Deine Auswertung.'):caseExam.title)+`<div class="case-exam"><div class="exam-bar">${exam.finished?`<strong id="case-exam-score">${caseScore()} / ${casePoints()} Punkte · Selbstbewertung</strong>`:`<span class="timer" id="exam-timer" role="timer">60:00</span><span class="muted">${caseAnswered()} / ${caseTasks().length} Teilaufgaben begonnen</span>${button('Abgeben','submit-exam','','secondary')}`}</div><p class="notice">${exam.finished?'Vergleiche deine Antworten und Rechenwege mit dem Erwartungshorizont. Vergib danach die Punkte selbst. Es gibt keine automatische Bewertung deiner Texte.':'Zeige bei Berechnungen den Ansatz, eingesetzte Werte und das Ergebnis mit Einheit. Leite Empfehlungen aus dem Fall ab. Du kannst auch auf Papier rechnen und die wichtigsten Schritte hier festhalten.'}</p><details class="case-background" open><summary>Ausgangssituation</summary><p>${caseExam.intro}</p></details>${caseExam.sections.map(s=>`<section class="case-section"><h2>${s.title}</h2><p class="exercise-prompt">${s.context}</p>${caseMaterials(s)}${s.tasks.map(t=>caseTask(t,'exam')).join('')}</section>`).join('')}<div class="action-row">${exam.finished?button('Zur Klausurauswahl','reset-exam'):button('Fallklausur abgeben','submit-exam')}</div><p class="source-line">${caseExam.note}</p></div>`;}

function examView(){if(exam?.kind==='case')return caseExamView();if(!exam)return head('KLAUSURMODUS','Vom Wissen zur Anwendung.','Wähle die neue Fallklausur oder den gemischten Wissenstest.')+caseIntro()+`<div class="narrow panel"><div class="eyebrow">GEMISCHTER WISSENSTEST · 29 PUNKTE</div><h2 style="margin-top:16px">Einmal alles zusammen.</h2><div class="result-list"><div class="result-row row spread"><span>8 Wissensfragen</span><span class="muted">8 Punkte</span></div><div class="result-row row spread"><span>3 Rechenaufgaben</span><span class="muted">6 Punkte</span></div><div class="result-row row spread"><span>3 offene Fallaufgaben</span><span class="muted">15 Punkte · Selbstcheck</span></div></div><p class="muted" style="margin-top:20px">Lege Papier und Taschenrechner bereit. Der Timer läuft auch weiter, wenn du die Ansicht wechselst. Unbeantwortete Fragen zählen als falsch. Offene Antworten bewertest du anschließend selbst am Erwartungshorizont.</p><div class="action-row">${button('40-Minuten-Klausur starten','start-exam')}</div>${state.examHistory.length?`<p class="source-line">Letzte abgegebene Klausur: ${new Date(state.examHistory.at(-1).date).toLocaleDateString('de-DE')} · ${state.examHistory.at(-1).auto} / 14 automatisch bewertete Punkte.</p>`:''}</div>`;
 if(exam.finished)return examResults();
 const answered=Object.values(exam.answers).filter(v=>String(v).trim()).length;
 return head('KLAUSURMODUS','Jetzt bist du dran.')+`<div class="narrow"><div class="exam-bar"><span class="timer" id="exam-timer" role="timer">40:00</span><span class="muted">${answered} / 14 bearbeitet</span>${button('Abgeben','submit-exam','','secondary')}</div>${exam.mc.map((item,i)=>{const q=questions.find(x=>x.id===item.id);return `<section class="panel exam-question"><div class="row spread"><span class="eyebrow">AUFGABE ${i+1} · ${topicName(q.topic)}</span><span class="tag">1 Punkt</span></div><fieldset style="margin-top:16px"><legend>${q.prompt}</legend>${item.order.map(ix=>`<label class="radio-option"><input type="radio" name="exam-${q.id}" data-exam="${q.id}" value="${ix}" ${String(exam.answers[q.id])===String(ix)?'checked':''}><span>${q.options[ix]}</span></label>`).join('')}</fieldset></section>`;}).join('')}${exam.calc.map((id,i)=>{const q=calculations.find(x=>x.id===id);return `<section class="panel exam-question"><div class="row spread"><span class="eyebrow">AUFGABE ${i+9} · RECHNEN</span><span class="tag">2 Punkte</span></div><h3>${q.title}</h3><p class="exercise-prompt">${q.prompt}</p><label>Ergebnis in ${q.unit}<input type="text" inputmode="decimal" data-exam="${q.id}" value="${esc(exam.answers[q.id]??'')}"></label></section>`;}).join('')}${exam.cases.map((id,i)=>{const c=cases.find(x=>x.id===id);return `<section class="panel exam-question"><div class="row spread"><span class="eyebrow">AUFGABE ${i+12} · BEGRÜNDEN</span><span class="tag">5 Punkte</span></div><h3>${c.title}</h3><p class="exercise-prompt">${c.prompt}</p><label>Deine Antwort<textarea data-exam="${c.id}">${esc(exam.answers[c.id]||'')}</textarea></label></section>`;}).join('')}<div class="action-row">${button('Klausur abgeben & auswerten','submit-exam')}</div></div>`;
}
function beginExam(){const mc=[...shuffle(questions.filter(q=>q.topic==='bedarf')).slice(0,2),...shuffle(questions.filter(q=>q.topic==='sourcing')).slice(0,2),...shuffle(questions.filter(q=>q.topic==='lager')).slice(0,1),...shuffle(questions.filter(q=>q.topic==='bestell')).slice(0,2),...shuffle(questions.filter(q=>q.topic==='industrie')).slice(0,1)];exam={deadline:Date.now()+40*60*1000,mc:shuffle(mc).map(q=>({id:q.id,order:shuffle([0,1,2,3])})),calc:['r5','r13','r14'],cases:['f1',shuffle(['f2','f3'])[0],'f4'],answers:{},self:{},finished:false};saveExam();render();}
function examScore(){let n=0;for(const i of exam.mc){const q=questions.find(q=>q.id===i.id);if(String(exam.answers[q.id])===String(q.correct))n++;}for(const id of exam.calc){const q=calculations.find(q=>q.id===id);if(Math.abs(number(exam.answers[id]??'')-q.answer)<=q.tolerance)n+=2;}return n;}
function finishExam(timed=false){if(!exam||exam.finished)return;if(exam.kind==='case'){exam.finished=true;exam.timed=timed;saveExam();render();window.scrollTo(0,0);return;}exam.finished=true;exam.timed=timed;state.examHistory.push({date:Date.now(),auto:examScore()});state.examHistory=state.examHistory.slice(-10);for(const i of exam.mc){const q=questions.find(q=>q.id===i.id);state.answers[q.id]={correct:String(exam.answers[q.id])===String(q.correct),attempts:(state.answers[q.id]?.attempts||0)+1};}save();saveExam();render();window.scrollTo(0,0);}
function examResults(){const score=examScore(),self=Object.values(exam.self).filter(Boolean).length;return head('AUSWERTUNG',exam.timed?'Die Zeit ist um.':'Klausur abgegeben.')+`<div class="narrow"><section class="panel"><div class="eyebrow">AUTOMATISCH BEWERTETE AUFGABEN</div><div class="score">${score}<span class="muted" style="font-size:1.5rem;letter-spacing:0"> / 14 Punkte</span></div><p class="muted">Wissensfragen und Rechenergebnisse. Die 15 Punkte für die offenen Aufgaben kommen durch deinen Selbstcheck hinzu.</p><div class="notice" id="exam-total">Mit deiner Selbsteinschätzung: ${score+self} / 29 Punkte. Das ist ein Übungswert, keine verbindliche Schulnote.</div></section>${exam.mc.map((i,index)=>{const q=questions.find(q=>q.id===i.id),correct=String(exam.answers[q.id])===String(q.correct);return `<div class="result-row"><p><span class="${correct?'success':'failure'}">${correct?'✓':'×'}</span> ${index+1}. ${q.prompt}</p><p class="small muted">Deine Antwort: ${esc(q.options[exam.answers[q.id]]??'Nicht beantwortet')}</p><p class="small">Richtig: ${q.options[q.correct]}</p><p class="small muted">${q.explanation}</p></div>`;}).join('')}${exam.calc.map((id,index)=>{const q=calculations.find(q=>q.id===id),correct=Math.abs(number(exam.answers[id]??'')-q.answer)<=q.tolerance;return `<div class="result-row"><p class="${correct?'success':'failure'}">${correct?'✓':'×'} ${index+9}. ${q.title} · ${correct?2:0}/2 Punkte</p><p class="small muted">Dein Ergebnis: ${esc(exam.answers[id]||'Nicht beantwortet')} ${q.unit}</p>${q.steps.map(s=>`<p class="small">${s}</p>`).join('')}</div>`;}).join('')}${exam.cases.map((id,index)=>{const c=cases.find(c=>c.id===id);return `<section class="panel exam-question"><div class="eyebrow">${index+12}. SELBSTCHECK · MAXIMAL 5 PUNKTE</div><h3>${c.title}</h3><div class="user-answer">${esc(exam.answers[id]||'Nicht beantwortet')}</div><p class="field-help" style="margin-top:14px">Ein Punkt für jedes in deiner Antwort nachvollziehbar erfüllte Kriterium.</p><div class="rubric">${c.rubric.map((r,i)=>`<label class="check-label"><input type="checkbox" data-self="${id}-${i}" ${exam.self[id+'-'+i]?'checked':''} ${!String(exam.answers[id]||'').trim()?'disabled':''}>${r}</label>`).join('')}</div><details><summary>Mögliche Antwort</summary><p>${c.sample}</p></details></section>`;}).join('')}<div class="action-row">${button('Neue Probeklausur vorbereiten','reset-exam')}<a class="button secondary" href="#ueben">Gezielt weiterüben</a></div></div>`;}
function tick(){if(!exam||exam.finished)return;const left=Math.max(0,Math.ceil((exam.deadline-Date.now())/1000));const el=$('#exam-timer');if(el)el.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;if(left===0)finishExam(true);}
setInterval(tick,1000);
function dialog(title,content,actions=''){ $('#dialog-content').innerHTML=`<h2 id="dialog-title">${title}</h2>${content}${actions}`;$('#info-dialog').showModal();}
function sources(){dialog('Dein Stoffumfang',`<p>Der Themencheck bildet die 13 verbleibenden Punkte deiner Klausur-Checkliste ab. Grundlage der Lerntexte ist <strong>BRC 3.pdf</strong>.</p><ul><li>Bedarfsermittlung: PDF S. 3–4.</li><li>Sourcing: die sieben zugewiesenen Konzepte, S. 12–13 und 34–36.</li><li>Lagerwirtschaft: S. 14–21.</li><li>Bestellmenge: S. 16, 19 und 30–33.</li><li>Industrie 4.0: kurzer Zusatz aus S. 24–26.</li></ul><p>Die neue Checkliste ergänzt ausdrücklich die kritische Lagermenge. Dazu enthält die Seite ein erläutertes Rechenmodell und gekennzeichnete Übungszahlen. Neu formulierte Anwendungsfälle sind Übungen, keine Originalaufgaben.</p><p>Rechenwerte wurden geprüft; handschriftliche Rechenfehler werden nicht übernommen. Du lernst die Formeln für Bestellmenge, Bedarfsermittlung und kritische Lagermenge. Andere Lagerkennzahlen bleiben Begriffe.</p><p>Die zusätzliche Fallklausur nutzt den Aufbau der bereitgestellten Abituraufgabe von 2019 (Ausgangssituation, Anlagen, Operatoren und Teilaufgaben). Unternehmen, Zahlen und Aufgaben sind neu erstellt. Die Themen der Abitur-PDF werden nicht zusätzlich als Lernstoff übernommen.</p><p>Fortschritt, Themencheck und Antworten werden nur in deinem Browser gespeichert.</p>`);}
function checklistCounts(){return {sure:checklist.filter(c=>state.mastery[c.id]===2).length,practice:checklist.filter(c=>state.mastery[c.id]===1).length,total:checklist.length};}
function nextCompetency(){return checklist.find(c=>state.mastery[c.id]===1)||checklist.find(c=>state.mastery[c.id]!==2)||checklist[0];}
function home(){
 const c=checklistCounts(),next=nextCompetency(),percent=Math.round(c.sure/c.total*100),wrong=questions.filter(q=>state.answers[q.id]?.correct===false).length;
 return head('BRC / KLASSE 13','Wissen, was drankommt.','Deine Klausur-Checkliste. Ein Thema nach dem anderen.',`<span class="edition">MAPPE + CHECKLISTE</span>`)+`
 <div class="overview-hero"><section class="next-block"><span class="eyebrow">DEIN NÄCHSTER SCHRITT · ${topicName(next.topic)}</span><h2>${next.label}</h2><p>Verstehen. Selbst ausprobieren. Sicher abhaken.</p><div class="row wrap"><a class="button" href="#lernen/${next.lessons[0]}">Jetzt lernen <span aria-hidden="true">↗</span></a>${button('10 Fragen starten','quick','','secondary')}</div></section><a class="readiness" href="#checkliste" aria-label="Themencheck öffnen: ${c.sure} von ${c.total} Themen sicher"><svg viewBox="0 0 160 160" aria-hidden="true"><circle class="ring-track" cx="80" cy="80" r="65"/><circle class="ring-fill" cx="80" cy="80" r="65" stroke-dasharray="${percent*4.084} 409"/></svg><div class="ring-text"><strong>${c.sure}<span> / ${c.total}</span></strong><span>sicher eingeschätzt</span></div></a></div>
 <div class="study-strip"><span><i class="status-dot sure"></i>${c.sure} sicher</span><span><i class="status-dot practice"></i>${c.practice} noch üben</span><span>${c.total-c.sure-c.practice} offen</span><a class="text-link" href="#checkliste">Themencheck öffnen →</a></div>
 <div class="section-heading"><h2>Dein Prüfungsstoff</h2><span class="small muted">Nach deiner Checkliste</span></div><div class="topic-grid">${topics.map(t=>{const ls=lessons.filter(l=>l.topic===t.id),cs=checklist.filter(c=>c.topic===t.id),done=cs.filter(c=>state.mastery[c.id]===2).length;return `<a class="topic-tile ${t.id==='industrie'?'supplement':''}" href="#lernen/${ls[0].id}"><div class="row spread"><span class="topic-num">${t.num}</span><span class="small muted">${t.id==='industrie'?'KURZER ZUSATZ':t.time}</span></div><h3>${t.name}</h3><p>${t.desc}</p><div class="tile-footer"><span>${cs.length?`${done}/${cs.length} Checkpunkte sicher`:'Grundwissen aus der Mappe'}</span><span aria-hidden="true">↗</span></div>${cs.length?progress(done/cs.length*100):''}</a>`;}).join('')}</div>
 <div class="bottom-grid"><section class="panel"><span class="eyebrow">KONZENTRIERT WEITER</span><h3 style="margin-top:12px">Eine Viertelstunde nur für BRC.</h3><p class="muted" style="margin:12px 0 20px">Starte eine kurze Lernzeit. Der Timer begleitet dich durch alle Bereiche.</p>${button('15 Minuten Lernfokus','start-focus','','secondary')}</section><section class="panel"><span class="eyebrow">AKTIV WIEDERHOLEN</span><h3 style="margin-top:12px">${wrong?`${wrong} Fragen nochmal ansehen.`:'Nicht nur lesen – selbst abrufen.'}</h3><p class="muted" style="margin:12px 0 20px">${questions.length} Wissensfragen, ${calculations.length} Rechenaufgaben und eine Tabelle zum Ausfüllen.</p>${button(wrong?'Meine Fehler üben':'Übungen öffnen',wrong?'errors':'go-practice','','secondary')}</section></div>`;
}
function checklistView(){const c=checklistCounts();return head('DEIN THEMENCHECK','Was sitzt schon?','Deine eigene Einschätzung. Gelesen heißt noch nicht sicher.')+`<div class="check-summary"><strong>${c.sure} / ${c.total}</strong><span>sicher</span>${progress(c.sure/c.total*100)}<button class="text-link" data-action="weak-quiz">Offene Themen üben →</button></div>${topics.filter(t=>t.id!=='industrie').map(t=>`<section class="check-group"><div class="section-heading"><h2><span class="muted">${t.num}</span> ${t.name}</h2></div>${checklist.filter(c=>c.topic===t.id).map(c=>`<article class="competency ${state.mastery[c.id]===2?'is-sure':''}"><div class="competency-main"><span class="competency-check" aria-hidden="true">${state.mastery[c.id]===2?'✓':'·'}</span><div><h3>${c.label}</h3><div class="competency-links"><a href="#lernen/${c.lessons[0]}">Nachlesen</a><button data-action="competency-quiz" data-id="${c.id}">Abfragen</button>${c.lab?`<a href="#rechner/${c.lab}">Ausprobieren</a>`:''}</div></div></div><div class="mastery-buttons" role="group" aria-label="${c.label}">${['Offen','Üben','Sicher'].map((name,i)=>`<button data-action="mastery" data-id="${c.id}" data-level="${i}" class="${(state.mastery[c.id]||0)===i?'selected':''}" aria-pressed="${(state.mastery[c.id]||0)===i}">${name}</button>`).join('')}</div></article>`).join('')}</section>`).join('')}<p class="source-line">Grundlage: deine Klausur-Checkliste. Industrie 4.0 bleibt als kurzer Zusatz im Lernstoff.</p>`;}
function labNavigation(active){return `<div class="segmented" aria-label="Rechenhilfe">${[['eoq','Bestellmenge'],['bedarf','Brutto- & Nettobedarf'],['lager','Eigen- / Fremdlager']].map(([id,name])=>`<a href="#rechner/${id}" class="${active===id?'active':''}" ${active===id?'aria-current="page"':''}>${name}</a>`).join('')}</div>`;}
function calculator(){const mode=['bedarf','lager'].includes(sub)?sub:'eoq';if(mode==='eoq')return labNavigation(mode)+eoqCalculator();return head('RECHENLABOR',mode==='bedarf'?'Brutto und netto selbst berechnen.':'Ab wann lohnt sich das Eigenlager?','Werte ändern, Rechenweg nachvollziehen und das Ergebnis einordnen.')+labNavigation(mode)+(mode==='bedarf'?demandLab():warehouseLab());}
function numericField(key,label,value,unit=''){return `<label>${label}<input type="text" inputmode="decimal" name="${key}" value="${String(value).replace('.',',')}" required><span class="field-help">${unit}</span></label>`;}
function demandLab(){return `<div class="lab-layout"><form class="panel" id="demand-form"><span class="eyebrow">ROHLINGE · PDF S. 3–4</span><div class="form-grid">${[['primary','Primärbedarf', 'Produkte'],['per','Rohlinge je Produkt','Stück'],['extra','Zusatzbedarf','% Zuschlag'],['stock','Lagerbestand','Stück'],['ordered','Bestellbestand','Stück'],['reserved','Vormerkbestand','Stück'],['safety','Sicherheitsbestand','Stück']].map(([k,l,u])=>numericField(k,l,demandData[k],u)).join('')}</div><button class="button" type="submit">Bedarf berechnen</button><p class="error" id="demand-error" role="alert"></p></form><div id="demand-results">${demandResult()}</div></div>`;}
function demandResult(){const d=demandData,r=netRequirement(d);return `<section class="panel"><span class="eyebrow">DEIN RECHENWEG</span><div class="flow-value"><span>1 · Sekundärbedarf</span><strong>${fmt(r.secondary,2)} Stück</strong><small>${fmt(d.primary)} × ${fmt(d.per,2)}</small></div><div class="flow-value"><span>2 · Bruttobedarf</span><strong>${fmt(r.gross,2)} Stück</strong><small>Zusatzbedarf: ${fmt(r.secondary,2)} × ${fmt(d.extra,2)} / 100 = ${fmt(r.extra,2)}</small><small>Brutto: ${fmt(r.secondary,2)} + ${fmt(r.extra,2)} = ${fmt(r.gross,2)}</small></div><div class="balance-lines">${[['Bruttobedarf',r.gross],['− Lagerbestand',-d.stock],['− Bestellbestand',-d.ordered],['+ Vormerkbestand',d.reserved],['+ Sicherheitsbestand',d.safety]].map(([l,v])=>`<div><span>${l}</span><strong>${fmt(v,2)}</strong></div>`).join('')}</div><p class="formula">Netto = ${fmt(r.gross,2)} − ${fmt(d.stock,2)} − ${fmt(d.ordered,2)} + ${fmt(d.reserved,2)} + ${fmt(d.safety,2)} = ${fmt(r.raw,2)} Stück</p><div class="lab-answer"><span>3 · Neu zu beschaffen</span><strong>${fmt(r.net,2)} <small>Stück</small></strong></div>${r.raw<0?`<p class="notice">Der rechnerische Nettobedarf beträgt ${fmt(r.raw,2)}. Die vorhandene Menge reicht aus; es muss nichts zusätzlich beschafft werden.</p>`:''}<a class="text-link" href="#lernen/d2">Die Vorzeichen verstehen →</a></section>`;}
function warehouseLab(){return `<div class="lab-layout"><form class="panel" id="warehouse-form"><span class="eyebrow">ÜBUNGSBEISPIEL ZUR CHECKLISTE</span><div class="form-grid">${[['fixed','Fixkosten Eigenlager','€ pro Jahr'],['variable','Variabel: Eigenlager','€ je Einheit'],['external','Fremdlager','€ je Einheit'],['quantity','Vergleichsmenge','Einheiten im selben Jahr']].map(([k,l,u])=>numericField(k,l,warehouseData[k],u)).join('')}</div><button class="button" type="submit">Kosten vergleichen</button><p class="error" id="warehouse-error" role="alert"></p><p class="field-help">Modell: lineare Kosten, Fremdlager ohne eigene Fixkosten. Die Zahlen sind ein Übungsbeispiel, keine Originalaufgabe der Mappe.</p></form><div id="warehouse-results">${warehouseResult()}</div></div>`;}
function warehouseResult(){const d=warehouseData,r=storageComparison(d);return `<section class="panel"><span class="eyebrow">KRITISCHE LAGERMENGE</span><div class="lab-answer"><strong>${r.threshold===null?'Kein Schnittpunkt':fmt(r.threshold,2)} <small>${r.threshold===null?'bei positiver Menge':'Einheiten'}</small></strong></div><p class="formula">${r.threshold===null?'Der Fremdlagersatz ist nicht höher als der variable Eigenlagersatz.':`${fmt(d.fixed)} / (${fmt(d.external,2)} − ${fmt(d.variable,2)}) = ${fmt(r.threshold,2)}`}</p>${warehouseChart(d,r)}<div class="chart-legend"><span>Eigenlager</span><span class="ordering">Fremdlager</span></div><div class="metric-row"><div><strong>${eur(r.own)}</strong><span>Eigenlager bei ${fmt(d.quantity)} Einheiten</span></div><div><strong>${eur(r.external)}</strong><span>Fremdlager bei ${fmt(d.quantity)} Einheiten</span></div></div><div class="notice">${r.winner==='equal'?'Beide Alternativen kosten bei dieser Menge gleich viel.':`${r.winner==='own'?'Das Eigenlager':'Das Fremdlager'} ist bei dieser Menge um ${eur(Math.abs(r.own-r.external))} günstiger.`}</div><a href="#lernen/b6" class="text-link">Formel und Interpretation nachlesen →</a></section>`;}
function warehouseChart(d,r){const max=Math.max(1,d.quantity*1.5,(r.threshold||0)*1.4),maxY=Math.max(d.fixed+d.variable*max,d.external*max,1)*1.1,X=x=>62+x/max*470,Y=y=>205-y/maxY*175;return `<svg class="chart" viewBox="0 0 550 250" role="img" aria-label="Kostenvergleich: Eigenlager und Fremdlager${r.threshold!==null?`, Schnittpunkt bei ${fmt(r.threshold,2)} Einheiten`:''}">${[0,.5,1].map(v=>`<line class="chart-grid" x1="62" x2="532" y1="${Y(maxY*v)}" y2="${Y(maxY*v)}"/><text text-anchor="end" x="55" y="${Y(maxY*v)+4}">${fmt(maxY*v)}</text>`).join('')}<text x="62" y="15">€ / Jahr</text><text x="62" y="224">0</text><text text-anchor="end" x="532" y="224">${fmt(max)} Einheiten</text><path d="M62 ${Y(d.fixed)} L532 ${Y(d.fixed+d.variable*max)}" fill="none" stroke="var(--accent)" stroke-width="3"/><path d="M62 ${Y(0)} L532 ${Y(d.external*max)}" fill="none" stroke="#b3cbd6" stroke-width="3"/>${r.threshold===null?'':`<line x1="${X(r.threshold)}" x2="${X(r.threshold)}" y1="${Y(d.external*r.threshold)}" y2="205" stroke="var(--muted)" stroke-dasharray="4 5"/><circle cx="${X(r.threshold)}" cy="${Y(d.external*r.threshold)}" r="5" fill="var(--ink)"/><text x="${X(r.threshold)}" y="244" text-anchor="middle">xₖ = ${fmt(r.threshold,2)}</text>`}</svg>`;}
const tableFields=[['q','Bestellmenge','l'],['stock','Ø Lagerbestand','l'],['value','Ø Bestandswert','€'],['holding','Lagerhaltungskosten','€'],['ordering','Bestellkosten pro Jahr','€'],['relevant','Kostensumme','€']];
function tablePractice(){const n=tableFrequency,d=presets.metal;return `<div class="narrow"><section class="panel"><div class="row spread"><span class="eyebrow">METALLLACK · PDF S. 33</span><label class="table-choice">Bestellungen pro Jahr<select id="table-frequency">${d.frequencies.map(x=>`<option ${x===n?'selected':''}>${x}</option>`).join('')}</select></label></div><h2 style="margin-top:20px">Eine Tabellenzeile selbst rechnen.</h2><p class="muted" style="margin-top:14px">Jahresbedarf 9.000 l · Preis 10,60 €/l · 90 € je Bestellung · Lagerkostensatz 20 % · Mindestbestand 50 l.</p><form id="table-practice-form"><div class="table-work">${tableFields.map(([key,label,unit],i)=>`<label class="table-field ${tableFeedback?(tableFeedback[key]?'cell-right':'cell-wrong'):''}"><span><small>${String(i+1).padStart(2,'0')}</small> ${label}</span><div><input type="text" inputmode="decimal" name="${key}" value="${esc(tableAnswers[key]||'')}" placeholder="Dein Ergebnis" aria-label="${label}" required><span>${unit}</span></div>${tableFeedback?`<small>${tableFeedback[key]?'Richtig':'Nochmal prüfen'}</small>`:''}</label>`).join('')}</div><div class="action-row"><button class="button" type="submit">Zeile prüfen</button><span class="small muted">${tableFeedback?`${Object.values(tableFeedback).filter(Boolean).length} / 6 Felder richtig`:'Mindestbestand nicht vergessen.'}</span></div></form><details><summary>Ansatz und Lösung anzeigen</summary><div>${(()=>{const r=costs(d,d.J/n);return [`q = 9.000 / ${n} = ${fmt(r.q,2)} l`,`Ø Bestand = ${fmt(r.q,2)} / 2 + 50 = ${fmt(r.stock,2)} l`,`Ø Wert = ${fmt(r.stock,2)} × 10,60 = ${eur(r.value)}`,`Lagerkosten = ${fmt(r.value,2)} × 0,20 = ${eur(r.holding)}`,`Bestellkosten = ${n} × 90 = ${eur(r.ordering)}`,`Summe = ${eur(r.relevant)}`].map(x=>`<p>${x}</p>`).join('');})()}</div></details></section></div>`;}
function drawFocus(){let node=document.getElementById('focus-timer');if(!state.focusUntil){node?.remove();return;}if(!node){node=document.createElement('aside');node.id='focus-timer';node.className='focus-timer';node.innerHTML='<span class="focus-dot"></span><span>Lernfokus</span><strong id="focus-time"></strong><button data-action="stop-focus" aria-label="Lernfokus beenden">×</button>';document.body.append(node);}const left=Math.max(0,Math.ceil((state.focusUntil-Date.now())/1000));document.getElementById('focus-time').textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;if(!left){state.focusUntil=null;save();node.remove();toast('15 Minuten geschafft. Zeit für eine kurze Pause.');}}

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 if(['calculate','check-calc'].includes(a))return;
 if(a==='sources')return sources();
 if(a==='start-case-exam')return startCaseExam();
 if(a==='open-case-study'){practiceTab='abi';navigate('ueben');return;}
 if(a==='case-section'){caseStudySection=Number(b.dataset.index);render();return;}
 if(a==='toggle-case-answer'){caseRevealed.has(b.dataset.id)?caseRevealed.delete(b.dataset.id):caseRevealed.add(b.dataset.id);render();return;}
 if(a==='mastery'){state.mastery[b.dataset.id]=Number(b.dataset.level);save();render();return;}
 if(a==='competency-quiz'){const c=checklist.find(c=>c.id===b.dataset.id);return startQuiz('all',999,questions.filter(q=>c.lessons.includes(q.lesson)).map(q=>q.id));}
 if(a==='weak-quiz'){const ids=new Set(checklist.filter(c=>state.mastery[c.id]!==2).flatMap(c=>c.lessons));if(!ids.size){toast('Alle Themen sicher eingeschätzt. Starte eine gemischte Lernrunde.');return;}return startQuiz('all',15,questions.filter(q=>ids.has(q.lesson)).map(q=>q.id));}
 if(a==='start-focus'){state.focusUntil=Date.now()+15*60000;save();drawFocus();toast('Lernfokus gestartet. Such dir ein Thema aus.');return;}
 if(a==='stop-focus'){state.focusUntil=null;save();drawFocus();return;}

 if(a==='quick')return startQuiz('all',10);
 if(a==='go-practice')return navigate('ueben');
 if(a==='read'){state.read=state.read.includes(b.dataset.id)?state.read.filter(id=>id!==b.dataset.id):[...state.read,b.dataset.id];save();render();return;}
 if(a==='topic-quiz')return startQuiz(b.dataset.topic,10);
 if(a==='practice-tab'){practiceTab=b.dataset.tab;render();return;}
 if(a==='start-quiz')return startQuiz($('#quiz-topic').value,Number($('#quiz-count').value));
 if(a==='errors')return startQuiz('all',999,questions.filter(q=>state.answers[q.id]?.correct===false).map(q=>q.id));
 if(a==='answer')return answerQuestion(Number(b.dataset.index));
 if(a==='next-question'){quiz.index++;render();return;}
 if(a==='reset-quiz'){quiz=null;render();return;}
 if(a==='repeat-quiz')return startQuiz('all',999,quiz.results.filter(a=>!a.correct).map(a=>a.id));
 if(a==='end-quiz'){quiz.items=quiz.items.slice(0,quiz.results.length);quiz.index=quiz.items.length;if(!quiz.items.length)quiz=null;render();return;}
 if(a==='calc-question'||a==='next-calc'){calcIndex=a==='next-calc'?(calcIndex+1)%calculations.length:Number(b.dataset.index);calcFeedback=null;render();return;}
 if(a==='case-question'){caseIndex=Number(b.dataset.index);caseOpen=false;render();return;}
 if(a==='case-solution'){caseOpen=!caseOpen;render();return;}
 if(a==='start-cards'){const topic=$('#card-topic').value,due=$('#card-mode').value==='due';const pool=cards.filter(c=>(topic==='all'||c.topic===topic)&&(!due||!state.cards[c.id]||state.cards[c.id].due<=Date.now()));if(!pool.length)return toast('Keine fälligen Karten. Wähle „Alle Karten“, um trotzdem zu üben.');deck={items:shuffle(pool).map(c=>c.id),index:0,reveal:false};render();return;}
 if(a==='flip'){if(deck&&!deck.reveal){deck.reveal=true;render();}return;}
 if(a==='rate-card'){const days=Number(b.dataset.days);state.cards[deck.items[deck.index]]={due:Date.now()+(days?days*86400000:600000),days};save();deck.index++;deck.reveal=false;render();return;}
 if(a==='reset-cards'){deck=null;render();return;}
 if(a==='start-exam')return beginExam();
 if(a==='submit-exam'){const left=exam.kind==='case'?caseTasks().length-caseAnswered():14-Object.values(exam.answers).filter(v=>String(v).trim()).length;dialog('Klausur abgeben?',`<p>${left?`${left} Aufgaben sind noch unbeantwortet. `:''}Nach der Abgabe siehst du die Lösungen und kannst deine offenen Antworten selbst bewerten.</p>`,button('Jetzt abgeben','confirm-exam'));return;}
 if(a==='confirm-exam'){$('#info-dialog').close();finishExam();return;}
 if(a==='reset-exam'){exam=null;saveExam();render();window.scrollTo(0,0);return;}
});
document.addEventListener('submit',e=>{
 const id=e.target.id;
 if(id==='demand-form'||id==='warehouse-form'){
  e.preventDefault();const d=Object.fromEntries([...new FormData(e.target)].map(([k,v])=>[k,number(v)]));
  const valid=Object.values(d).every(v=>Number.isFinite(v)&&v>=0&&v<=1e8)&&(id==='demand-form'?d.primary>0&&d.per>0&&d.extra<=100:d.fixed>0&&d.external>0);
  const error=document.getElementById(id==='demand-form'?'demand-error':'warehouse-error');
  if(!valid){error.textContent=id==='demand-form'?'Bitte gültige, nicht negative Zahlen eingeben. Primärbedarf und Menge je Produkt müssen positiv sein; Zuschlag höchstens 100 %.':'Bitte gültige, nicht negative Zahlen eingeben. Fixkosten und Fremdlagersatz müssen positiv sein.';return;}
  error.textContent='';if(id==='demand-form'){demandData=d;$('#demand-results').innerHTML=demandResult();}else{warehouseData=d;$('#warehouse-results').innerHTML=warehouseResult();}
 }
 if(id==='table-practice-form'){
  e.preventDefault();tableAnswers=Object.fromEntries(new FormData(e.target));const expected=costs(presets.metal,presets.metal.J/tableFrequency);
  tableFeedback=Object.fromEntries(tableFields.map(([key])=>[key,Number.isFinite(number(tableAnswers[key]))&&Math.abs(number(tableAnswers[key])-expected[key])<.011]));
  if(Object.values(tableFeedback).every(Boolean)){state.calculations['table-'+tableFrequency]=true;save();}render();
 }
});
document.addEventListener('change',e=>{if(e.target.id==='table-frequency'){tableFrequency=Number(e.target.value);tableAnswers={};tableFeedback=null;render();}});

document.addEventListener('submit',e=>{if(e.target.id==='calc-answer-form'){e.preventDefault();const q=calculations[calcIndex],value=$('#calc-answer').value,n=number(value);if(!Number.isFinite(n))return toast('Bitte gib eine gültige Zahl ein.');const correct=Math.abs(n-q.answer)<=q.tolerance;calcFeedback={value,correct};if(correct){state.calculations[q.id]=true;save();}render();}if(e.target.id==='calculator-form'){e.preventDefault();const d={...calcData};for(const id of ['J','B','p','i','M'])d[id]=number($('#input-'+id).value);if(!validateInputs(d)){$('#calc-error').textContent='Bedarf, Bestellkosten und Preis müssen positiv sein. Kostensatz: über 0 bis 100 %. Mindestbestand: mindestens 0. Bitte prüfe deine Eingaben.';return;}if(preset==='oil'&&d.J<4000){$('#calc-error').textContent='Für dieses Rabattbeispiel muss der Jahresbedarf mindestens 4.000 l betragen. Nutze für andere Fälle „Eigene Werte“.';return;}calcData=d;sliderQ=null;render();}});
document.addEventListener('change',e=>{
 if(e.target.dataset.caseSelf&&exam?.kind==='case'&&exam.finished){exam.self[e.target.dataset.caseSelf]=e.target.checked;saveExam();$('#case-exam-score').textContent=`${caseScore()} / ${casePoints()} Punkte · Selbstbewertung`;}
 if(e.target.id==='calc-preset'){preset=e.target.value;calcData={...presets[preset]};sliderQ=null;render();}
 if(e.target.dataset.self){exam.self[e.target.dataset.self]=e.target.checked;saveExam();$('#exam-total').textContent=`Mit deiner Selbsteinschätzung: ${examScore()+Object.values(exam.self).filter(Boolean).length} / 29 Punkte. Das ist ein Übungswert, keine verbindliche Schulnote.`;}
});
document.addEventListener('input',e=>{
 if(e.target.id==='lesson-search'){const term=e.target.value.toLowerCase();document.querySelectorAll('.lesson-link').forEach(a=>a.hidden=!a.textContent.toLowerCase().includes(term));}

 if(e.target.dataset.caseStudy){state.drafts[e.target.dataset.caseStudy]=e.target.value;save();}
 if(e.target.id==='case-answer'){state.drafts[e.target.dataset.id]=e.target.value;save();}
 if(e.target.dataset.exam&&exam&&!exam.finished){exam.answers[e.target.dataset.exam]=e.target.value;saveExam();const counter=$('.exam-bar .muted');if(counter)counter.textContent=exam.kind==='case'?`${caseAnswered()} / ${caseTasks().length} Teilaufgaben begonnen`:`${Object.values(exam.answers).filter(v=>String(v).trim()).length} / 14 bearbeitet`;}
 if(e.target.id==='q-slider'){sliderQ=Number(e.target.value);$('#slider-value').textContent=`${fmt(sliderQ)} ${calcData.unit}`;$('#slider-cost').textContent=`Bei dieser Menge: ${eur(costs(calcData,sliderQ).relevant)} pro Jahr.`;$('#eoq-chart').innerHTML=costChart(calcData,calcOutput.q);}
});
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||$('#info-dialog').open)return;if(route==='ueben'&&practiceTab==='quiz'&&quiz&&quiz.index<quiz.items.length&&/^[1-4]$/.test(e.key)){e.preventDefault();answerQuestion(quiz.items[quiz.index].order[Number(e.key)-1]);}if(route==='karten'&&deck&&!deck.reveal&&deck.index<deck.items.length&&e.code==='Space'){e.preventDefault();deck.reveal=true;render();}});
function theme(){state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;save();$('#theme-toggle').textContent=state.theme==='dark'?'Helle Darstellung':'Dunkle Darstellung';}
$('#theme-toggle').addEventListener('click',theme);
const mobileTheme=document.createElement('button');mobileTheme.className='mobile-theme';mobileTheme.textContent='Hell / Dunkel';mobileTheme.setAttribute('aria-label','Zwischen heller und dunkler Darstellung wechseln');mobileTheme.addEventListener('click',theme);$('.sidebar').append(mobileTheme);
$('.skip').addEventListener('click',e=>{e.preventDefault();$('#main').focus();$('#main').scrollIntoView();});
setInterval(drawFocus,1000);drawFocus();
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);$('#main').focus({preventScroll:true});});
render();
// Optional browser agent integration. The normal site works without WebMCP.
if(document.modelContext?.registerTool){
 const lifecycle=new AbortController();
 const tool={name:'start_brc_practice',title:'BRC Lernrunde starten',description:'Startet eine neue sichtbare Wissensrunde. Ersetzt eine eventuell laufende Übungsrunde; der gespeicherte Lernfortschritt bleibt erhalten.',inputSchema:{type:'object',properties:{topic:{type:'string',enum:['all',...topics.map(t=>t.id)]},count:{type:'integer',minimum:1,maximum:50}},required:['topic','count'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){
  if(!input||!['all',...topics.map(t=>t.id)].includes(input.topic)||!Number.isInteger(input.count)||input.count<1||input.count>50||Object.keys(input).some(k=>!['topic','count'].includes(k)))throw new Error('Ungültiger Schwerpunkt oder Umfang.');
  if(exam&&!exam.finished)throw new Error('Eine Klausur läuft. Beende sie zuerst.');
  startQuiz(input.topic,input.count);render();return {started:true,count:quiz.items.length,topic:input.topic};
 }};
 try{Promise.resolve(document.modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});}catch{}
 window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});
}
