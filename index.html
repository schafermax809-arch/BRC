  <script type="module">
const topics=[
 {id:'sourcing',name:'Sourcing-Konzepte',short:'Sourcing',desc:'Lieferanten auswählen. Entscheidungen begründen.',num:'01',time:'20–25 Min.'},
 {id:'lager',name:'Lagerwirtschaft',short:'Lager',desc:'Lagerarten, Funktionen und Prinzipien sicher unterscheiden.',num:'02',time:'25–30 Min.'},
 {id:'bestell',name:'Optimale Bestellmenge',short:'Bestellmenge',desc:'Kosten verstehen. Mit Formel und Tabelle rechnen.',num:'03',time:'25–30 Min.'},
 {id:'industrie',name:'Industrie 4.0 im Überblick',short:'Industrie 4.0',desc:'Beispiele aus der Mappe und Folgen für Mitarbeitende.',num:'04',time:'5–10 Min.'}
];
const L=(id,topic,title,lead,sections,remember,source)=>({id,topic,title,lead,sections,remember,source});
const lessons=[
 L('s1','sourcing','Was ist ein Sourcing-Konzept?','Ein Sourcing-Konzept legt fest, wie ein Unternehmen seine Materialien und Bauteile beschafft.',[
 ['Die sieben Begriffe aus dem Arbeitsauftrag','Single, Dual und Multiple beschreiben die Anzahl der Lieferanten. Local, Domestic und Global beschreiben das Beschaffungsgebiet. Bei Modular Sourcing werden ganze Baugruppen beschafft.'],
 ['Ein Beispiel','Für ihre neue US-Produktionsstätte könnte SneakerStyled Material bei zwei Lieferanten in der Nähe einkaufen: Dual Sourcing und Local Sourcing.'],
 ['So begründest du in der Klausur','Nenne das Ziel aus dem Fall, wähle ein passendes Konzept und erkläre seine Wirkung. Wäge danach einen Nachteil ab. Beispiel: Zwei Lieferanten verringern das Ausfallrisiko. Dafür steigt der Abstimmungsaufwand.']
 ],'Konzept nennen → auf den Fall beziehen → Vorteil erklären → Nachteil abwägen.','PDF S. 12–13, 34–36'),
 L('s2','sourcing','Single, Dual & Multiple Sourcing','Hier geht es um die Anzahl der Lieferanten für einen bestimmten Beschaffungsgegenstand.',[
 ['Single Sourcing','Ein Lieferant. Vorteile: gebündelte Mengen, mögliche Rabatte, eingespielte Abläufe und enge Zusammenarbeit. Nachteile: hohe Abhängigkeit, Ausfallrisiko und schwieriger Lieferantenwechsel. Es muss nicht das gesamte Unternehmen alles bei diesem Lieferanten kaufen.'],
 ['Dual Sourcing','Zwei Lieferanten. Vorteile: Ausweichmöglichkeit, Risikoverteilung und trotzdem relativ enge Zusammenarbeit. Nachteile: mehr Abstimmung als bei Single Sourcing, aufgeteiltes Bestellvolumen. Eine Aufteilung von 70/30 ist ein Beispiel, keine feste Regel. Der zweite Lieferant muss freie Kapazitäten haben.'],
 ['Multiple Sourcing','Mehrere Lieferanten. Vorteile: Wettbewerb, größere Flexibilität und weniger Abhängigkeit von einem Anbieter. Nachteile: höhere Koordination, kleinere Mengen je Lieferant und mögliche Qualitätsunterschiede.'],
 ['Typischer Fall','Bei einem produktionskritischen Bauteil kann Dual Sourcing sinnvoll sein. Bei standardisierten Schrauben kommt auch Multiple Sourcing infrage. „Mehr Lieferanten ist immer besser“ wäre keine ausreichende Begründung.']
 ],'Single = 1, Dual = 2, Multiple = mehrere Lieferanten.','PDF S. 13, 34–35'),
 L('s3','sourcing','Local, Domestic & Global Sourcing','Hier entscheidet das Unternehmen, wo es einkauft.',[
 ['Local Sourcing','Einkauf in räumlicher Nähe zum Unternehmen. Vorteile: kurze Wege, oft schnelle Reaktion und einfachere Abstimmung. Nachteile: kleinere Auswahl und eventuell höhere Preise. Regional bedeutet nicht automatisch nachhaltig; Produktionsbedingungen zählen ebenfalls.'],
 ['Domestic Sourcing','Einkauf im eigenen Land. Das ist weiter gefasst als Local Sourcing. Ein Lieferant am anderen Ende Deutschlands ist inländisch, aber nicht unbedingt lokal.'],
 ['Global Sourcing','Weltweiter Einkauf. Vorteile: große Auswahl, Zugang zu Spezialwissen und mögliche Preisvorteile. Nachteile: längere Transportwege, höherer Koordinationsaufwand, Währungs- und politische Risiken. Ein niedriger Einkaufspreis allein beweist noch keinen Kostenvorteil.'],
 ['Übertrag auf SneakerStyled','Wenn Versorgungssicherheit und kurze Reaktionszeiten entscheidend sind, spricht das eher für nahe Lieferanten. Wenn ein spezielles Material nur im Ausland verfügbar ist, kann Global Sourcing sinnvoll sein.']
 ],'Anzahl und Standort sind zwei verschiedene Entscheidungen: Dual + Local ist möglich.','PDF S. 13, 36; Begriffe an S. 13 ausgerichtet'),
 L('s4','sourcing','Modular Sourcing','Dieses Konzept steht als einziger Begriff zur Art des Beschaffungsobjekts im Arbeitsauftrag.',[
 ['Bedeutung','Der Lieferant liefert ganze Module oder Baugruppen. Dadurch übernimmt er einen Teil der Wertschöpfung.'],
 ['Vorteile','Das Unternehmen arbeitet mit weniger einzelnen Bauteilen und kann das Wissen der Lieferanten nutzen. Laut Mappe können dadurch Entwicklungszeiten und Kosten sinken.'],
 ['Nachteile','Die Abhängigkeit vom Lieferanten steigt. Ein Ersatz für komplexe Module ist kurzfristig schwer zu finden. Die Qualitätskontrolle kann aufwendig sein.'],
 ['Worauf achten?','Die gelieferten Baugruppen müssen geprüft werden, damit sie die Qualitätsanforderungen erfüllen.']
 ],'Modular = ganze Baugruppen beschaffen; Vorteil: weniger Einzelteile, Nachteil: höhere Abhängigkeit.','PDF S. 12–13, 35'),
 L('l1','lager','Die vier Lagerarten','Die Lagerart beschreibt, an welcher Stelle im Materialfluss ein Lager liegt.',[
 ['Beschaffungslager','Lagert Roh-, Hilfs- und Betriebsstoffe für die Produktion. Beispiel: Stoffe, Klebstoff und Schnürbänder. Es sichert die Materialversorgung.'],
 ['Produktionslager','Lagert unfertige Erzeugnisse oder Halbfabrikate zwischen Fertigungsschritten. Beispiel: zugeschnittene, noch nicht montierte Schuhteile. Es entkoppelt die Arbeitsschritte.'],
 ['Absatzlager','Lagert fertige Produkte vor dem Verkauf oder Versand. Beispiel: fertige Sneaker in verschiedenen Größen. Es hält Waren für Kundenaufträge bereit.'],
 ['Umschlagslager','Dient der kurzfristigen Zwischenlagerung und Zusammenstellung beim Wechsel von Transportmitteln oder Transportabschnitten. Beispiel: Pakete werden für verschiedene Liefergebiete sortiert.']
 ],'Beschaffung → Produktion → Absatz. Umschlag betrifft den Transportfluss.','PDF S. 14, 20–21'),
 L('l2','lager','Welche Aufgaben haben die Lager?','Die Übersicht zu LS 5.2 ordnet jeder Lagerart eine Aufgabe im Materialfluss zu.',[
 ['Beschaffungslager','Es versorgt die Produktion mit Roh-, Hilfs- und Betriebsstoffen und gleicht Lieferverzögerungen aus.'],
 ['Produktionslager','Es lagert Halbfabrikate und unfertige Erzeugnisse zwischen und unterstützt einen kontinuierlichen Produktionsablauf.'],
 ['Absatzlager','Es hält fertige Waren für Kundenaufträge bereit und gleicht Unterschiede zwischen Produktion und Absatz aus.'],
 ['Umschlagslager','Es lagert Waren beim Übergang zwischen Lieferanten, Lagern und Kunden nur kurzzeitig und stellt sie zusammen.'],
 ['Der Zielkonflikt','Die Mappe nennt Versorgungssicherheit und Lieferbereitschaft als Ziele. Hohe Bestände binden aber Kapital und verursachen Lagerkosten.']
 ],'Ordne jede Funktion dem passenden Lager im Materialfluss zu.','PDF S. 14–16, 20–21'),
 L('l3','lager','Feste oder freie Lagerplätze?','Lagerplatzordnung beantwortet die Frage: Wo wird ein Artikel abgelegt?',[
 ['Festplatzsystem','Jeder Artikel hat einen fest zugeordneten Platz. Vorteile: einfache Orientierung und leicht verständliche Abläufe. Nachteile: reservierte Plätze bleiben bei fehlenden Artikeln leer; Flächen werden schlechter ausgenutzt.'],
 ['Freiplatzsystem / chaotische Lagerung','Die Ware kommt auf einen geeigneten freien Platz. Das System dokumentiert genau, wo sie liegt. Vorteile: gute Raumausnutzung und Flexibilität. Nachteile: zuverlässige Datenerfassung und Lagerverwaltung sind nötig; Ausfälle erschweren die Suche.'],
 ['Wichtige Unterscheidung','„Chaotisch“ bedeutet nicht ungeordnet. Auch hier gelten Anforderungen an Größe, Gewicht, Sicherheit und Lagerbedingungen. Die Information ersetzt den festen Platz.']
 ],'Fest: Artikel bestimmt den Platz. Frei: System kennt den tatsächlichen Platz.','PDF S. 14, 20–21; Vor- und Nachteile erläutert'),
 L('l4','lager','Eigenlager oder Fremdlager?','Die Frage ist, ob das Unternehmen die Lagerung selbst übernimmt oder einen Dienstleister nutzt.',[
 ['Eigenlager','Vorteile: direkte Kontrolle, individuelle Abläufe, eigene Qualitätssteuerung. Nachteile: Investitionen, Fixkosten, Personalbedarf und das Risiko ungenutzter Kapazitäten.'],
 ['Fremdlager','Vorteile: weniger eigene Investitionen, Zugriff auf Spezialwissen und oft anpassbare Kapazitäten. Nachteile: Abhängigkeit, weniger direkte Kontrolle und laufende Gebühren. Zusätzliche Wege können Zeit kosten.'],
 ['Eine Entscheidung begründen','Ein stabiler, hoher Bedarf kann für ein gut ausgelastetes Eigenlager sprechen. Bei stark schwankender Nachfrage kann ein Fremdlager sinnvoll sein. Auch Mischlösungen sind möglich. Eine Empfehlung braucht immer einen Fallbezug.']
 ],'Eigen = mehr Kontrolle und eigene Kapazität. Fremd = Dienstleistung und Abhängigkeit.','PDF S. 14, 20–21'),
 L('l5','lager','FIFO, LIFO, FEFO & Cross-Docking','Diese Strategien beschreiben, welche Ware zuerst rausgeht oder wie sie weitergeleitet wird.',[
 ['FIFO · First in, first out','Zuerst eingelagerte Ware wird zuerst ausgelagert. Das verringert lange Liegezeiten. Die Anordnung muss den Zugriff auf ältere Ware ermöglichen.'],
 ['LIFO · Last in, first out','Zuletzt eingelagerte Ware wird zuerst ausgelagert. Das kann bei stapelbaren, gleichartigen, nicht verderblichen Gütern praktisch sein. Ältere Bestände können lange liegen bleiben.'],
 ['FEFO · First expired, first out','Ware mit dem frühesten Ablaufdatum geht zuerst raus. Entscheidend ist das Ablaufdatum, nicht der Wareneingang. Chargen und Ablaufdaten müssen zuverlässig erfasst werden.'],
 ['Cross-Docking','Eingehende Ware wird mit sehr kurzer oder ohne eigentliche Lagerung weiterverteilt. Vorteil: geringe Bestände und kurze Durchlaufzeiten. Nachteil: genaue zeitliche Abstimmung ist nötig. Es ist ein Umschlagskonzept, keine Reihenfolgeregel wie FIFO.']
 ],'FIFO = Eingang. LIFO = letzter Eingang. FEFO = Ablaufdatum.','PDF S. 14, 20–21'),
 L('l6','lager','Bestände, Kosten & Kapitalbindung','Für deinen Schwerpunkt brauchst du diese Begriffe zu verstehen. Zusätzliche Kennzahlenformeln sind hier bewusst nicht enthalten.',[
 ['Mindest- bzw. Sicherheitsbestand','Reserve für unvorhergesehene Störungen. Bei planmäßigem Verbrauch wird diese Reserve nicht benötigt. Im Bestellmengenmodell kommt sie zum halben Bestelllos hinzu.'],
 ['Meldebestand','Der Bestand, bei dem die Nachbestellung ausgelöst wird. Er berücksichtigt den Verbrauch bis zur nächsten Lieferung und die Reserve. Mindestbestand und Meldebestand sind nicht dasselbe.'],
 ['Kapitalbindung','Das Geld steckt in gelagerter Ware und steht nicht für andere Zwecke zur Verfügung. Hinzu kommen Kosten für Fläche, Personal, Energie und Risiken wie Schwund.'],
 ['Weitere Kennzahlen einordnen','Lagerumschlag: Wie oft wird der durchschnittliche Bestand im Zeitraum erneuert? Lagerdauer: Wie lange bleibt Ware durchschnittlich im Lager? Mehr Umschlag bedeutet bei gleichem Modell eine kürzere Lagerdauer. Hier musst du dazu keine zusätzliche Formel lernen.']
 ],'Versorgungssicherheit und niedrige Bestände müssen zusammen abgewogen werden.','PDF S. 17–19'),
 L('b1','bestell','Das Prinzip der optimalen Bestellmenge','Gesucht ist die Bestellmenge, bei der die Summe aus Bestellkosten und Lagerhaltungskosten am niedrigsten ist.',[
 ['Viele kleine Bestellungen','Wenig Ware liegt im Durchschnitt auf Lager. Dafür wird häufig bestellt und die jährlichen Bestellkosten steigen.'],
 ['Wenige große Bestellungen','Es fallen weniger Bestellvorgänge an. Dafür steigen der durchschnittliche Lagerbestand, die Kapitalbindung und die Lagerhaltungskosten.'],
 ['Was wird minimiert?','Bei einem unveränderten Stückpreis sind die jährlichen Warenkosten bei gleichem Jahresbedarf konstant. Für die Auswahl genügen deshalb Bestellkosten + Lagerhaltungskosten. Wenn Rabatte den Preis ändern, muss man die Aufgabenstellung und den Kostenbegriff genau prüfen.'],
 ['Voraussetzungen','Das einfache Andler-Modell nimmt unter anderem einen bekannten, gleichmäßigen Bedarf, einen konstanten Stückpreis und feste Kosten je Bestellung an. Lieferungen kommen rechtzeitig und vollständig. Grenzen durch Platz, Liquidität oder Mindestmengen sind nicht automatisch berücksichtigt.']
 ],'Nicht die Lagerkosten allein sind minimal, sondern die Summe der relevanten Kosten.','PDF S. 16, 19, 30–33'),
 L('b2','bestell','Die Formeln, die du brauchst','Verwende durchgängig dieselbe Zeitbasis: Hier sind Jahresbedarf und jährlicher Lagerhaltungskostensatz gemeint.',[
 ['Bestellmenge und Häufigkeit','q = J / n und n = J / q. J ist der Jahresbedarf, n die Anzahl der Bestellungen im Jahr und q die Menge pro Bestellung.'],
 ['Durchschnittlicher Bestand','Ø Bestand = q / 2 + M. M ist der konstante Mindestbestand. Ohne Mindestbestand ist M = 0. Danach: Ø Bestandswert = Ø Bestand × Einstandspreis p.'],
 ['Die Kosten','Lagerhaltungskosten = Ø Bestandswert × i / 100. Bestellkosten pro Jahr = n × B. B sind die Kosten für eine einzelne Bestellung. Relevante Gesamtkosten = Lagerhaltungskosten + jährliche Bestellkosten.'],
 ['Andler-Formel','q* = √((200 × J × B) / (p × i)). In dieser Schreibweise steht i als Prozentzahl, also 20 für 20 %. Gleichwertig: √((2 × J × B) / (p × 0,20)). Beide Varianten niemals mischen.'],
 ['Wenn der Kostensatz fehlt','Falls jährliche Lagerhaltungskosten und der durchschnittliche Lagerbestandswert gegeben sind: i = Lagerhaltungskosten / Ø Bestandswert × 100. Nutze nur die laut Aufgabe einzubeziehenden Kosten; addiere keinen Zinssatz doppelt.']
 ],'200 mit Prozentzahl oder 2 mit Dezimalzahl. Einheiten dazuschreiben.','PDF S. 16, 18–19, 31, 33'),
 L('b3','bestell','Mindestbestand & richtig runden','Der Mindestbestand wird im Kostenvergleich berücksichtigt, aber nicht einfach auf die Bestellmenge aufgeschlagen.',[
 ['Beispiel Metalllack','J = 9.000 l, B = 90 €, p = 10,60 €/l, i = 20 %, M = 50 l. Bei zehn Bestellungen gilt: q = 900 l, Ø Bestand = 500 l, Ø Wert = 5.300 €, Lagerkosten = 1.060 €, Bestellkosten = 900 €. Summe = 1.960 € pro Jahr.'],
 ['Auswirkung der Reserve','Ein konstanter Mindestbestand erhöht jede Kostenalternative um M × p × i / 100. Bei konstantem Preis ändert er das mathematische Optimum nicht. Hier sind das 106 € pro Jahr.'],
 ['Formel und Entscheidungstabelle','Die Formel liefert ein theoretisches Optimum. Eine Tabelle vergleicht nur die aufgeführten Möglichkeiten. Beim Metalllack sind 900 l die günstigste der vorgegebenen Tabellenmengen; das Formelergebnis liegt etwas darunter.'],
 ['Runden','Rechne mit ungerundeten Zwischenwerten und runde Geldbeträge am Ende auf zwei Stellen. Bei Stückzahlen gelten die Vorgaben der Aufgabe. Soll die Anzahl der Bestellungen ganzzahlig sein, vergleiche die benachbarten ganzen Bestellhäufigkeiten.']
 ],'Die Reserve erhöht den Bestand, nicht automatisch die optimale Bestellmenge.','PDF S. 16, 30–33; Rechnungen neu geprüft'),
 L('b4','bestell','Mengenrabatt in der Entscheidungstabelle','Ein Rabatt verändert den Einstandspreis und damit den durchschnittlichen Lagerbestandswert.',[
 ['Rabatt anwenden','Bei einem Rabatt auf die gesamte Bestellmenge gilt: neuer Stückpreis = alter Stückpreis × (1 − Rabatt/100). Mit diesem Preis bewertest du den durchschnittlichen Lagerbestand. Auf die Bestellkosten B wird der Warenrabatt nicht angewendet.'],
 ['Die Summe in der Mappe','Die Entscheidungstabelle addiert die jährlichen Bestellkosten und Lagerhaltungskosten. Vergleiche für die Aufgabe genau diese Summe.'],
 ['Motoröl aus der Mappe','60.000 l im Jahr; Preis 8 €/l; Rabatt ab 4.000 l: 10 %, ab 6.000 l: 12 %, ab 20.000 l: 15 %. Bei 12.000 l gelten deshalb 12 % und 7,04 €/l, nicht 15 %. In der vorgegebenen Tabelle hat 4.000 l die niedrigsten Bestell- und Lagerkosten.'],
 ['Entscheidung','Vergleiche nur die Bestellmengen aus der Tabelle. Die Zeile mit der kleinsten Gesamtkostensumme ist die Lösung der Tabellenaufgabe.']
 ],'Rabattgrenze prüfen → neuen Einstandspreis einsetzen → Kosten in der Tabelle vergleichen.','PDF S. 32'),
 L('i1','industrie','Industrie 4.0 – kurz erklärt','In der Mappe beschreibt SneakerStyled, wie Digitalisierung die Produktion und die Arbeit verändert.',[
 ['Was bedeutet das hier?','Maschinen und Abläufe werden digital verbunden. Daten aus der Produktion werden erfasst und können für die Zusammenarbeit und Planung genutzt werden. Die Mappe nennt das eine Entwicklung zur Smart Factory.'],
 ['Beispiele aus SneakerStyled','Maschinen nutzen Touchscreens und Sensoren. Ein Roboter arbeitet Mitarbeitenden zu. Produktionsdaten und Zeiten stehen in der Firmencloud. Autonome Karren bringen fertige Sneaker ins Lager.'],
 ['Chancen und Probleme','Laut Vorstand arbeitet das Unternehmen effizienter und kostengünstiger. Zugleich fühlen sich einige Beschäftigte bei den neuen Prozessen abgehängt und haben Angst, durch Maschinen ersetzt zu werden.'],
 ['Was sollte das Unternehmen tun?','Beschäftigte früh in Veränderungen einbeziehen und passende Schulungen zu neuen Maschinen und Abläufen anbieten. Die Mappe nennt auch Schulungsbedarf für Mitarbeitende an internationalen Standorten.']
 ],'Beispiel nennen → Nutzen erklären → Auswirkung auf Mitarbeitende berücksichtigen.','PDF S. 24–26')
];
const Q=(id,topic,prompt,answer,distractors,explanation,lesson)=>({id,topic,prompt,options:[answer,...distractors],correct:0,explanation,lesson});
const questions=[
 Q('s01','sourcing','Was beschreibt Single Sourcing?','Ein bestimmtes Material wird bei einem Lieferanten beschafft.',['Das Unternehmen produziert alle Teile selbst.','Jede Bestellung darf nur ein Teil enthalten.','Das Unternehmen darf nur in einem Land einkaufen.'],'Single Sourcing beschreibt die Lieferantenzahl je Beschaffungsgegenstand.','s2'),
 Q('s02','sourcing','Welcher Vorteil spricht besonders für Single Sourcing?','Gebündelte Mengen und eingespielte Zusammenarbeit.',['Keine Abhängigkeit vom Lieferanten.','Garantiert keine Qualitätsprobleme.','Beliebig viele Ausweichlieferanten.'],'Eine enge Beziehung erleichtert Abläufe und Mengenbündelung, beseitigt Risiken aber nicht.','s2'),
 Q('s03','sourcing','Ein wichtiger Lieferant fällt aus. Welches Risiko zeigt sich bei Single Sourcing?','Die Produktion kann wegen der Abhängigkeit stillstehen.',['Die Lagerbestände steigen immer.','Die Lieferantenanzahl ist zu hoch.','Die Materialqualität verbessert sich automatisch.'],'Fehlt eine einsatzbereite Alternative, kann die Materialversorgung ausfallen.','s2'),

 {id:'f3',topic:'lager',title:'Eigenlager für die Saisonspitze?',prompt:'Ein Unternehmen braucht im Weihnachtsgeschäft doppelt so viel Lagerfläche wie im Rest des Jahres. Die Geschäftsleitung erwägt, ein großes Eigenlager zu bauen. Beurteile eine Alternative.',rubric:['Schwankende Auslastung und mögliche Leerkapazitäten erkennen.','Fremdlager für die saisonale Zusatzmenge als Alternative vorschlagen.','Geringere eigene Investitionen und anpassbare Kapazität erklären.','Gebühren, Abhängigkeit und mögliche zusätzliche Transportwege nennen.','Eine zum Fall passende Empfehlung formulieren, zum Beispiel Eigenlager plus saisonales Fremdlager.'],sample:'Ein großes Eigenlager wäre außerhalb der Saison möglicherweise schlecht ausgelastet. Deshalb würde ich die normale Menge selbst lagern und für die Saisonspitze ein Fremdlager nutzen. Das spart eigene Investitionen und hält die Kapazität anpassbar. Allerdings fallen Gebühren an und das Unternehmen wird vom Dienstleister abhängig. Die Kosten und die Lieferzeiten sollten deshalb verglichen werden.'},

const number = value => {
  const s=String(value).trim().replace(/\s/g,'');
  if(!s)return NaN;
  if(s.includes(','))return Number(s.replace(/\./g,'').replace(',','.'));
  if(/^\d{1,3}(\.\d{3})+$/.test(s)) return Number(s.replace(/\./g,''));
  return Number(s);
};
function validateInputs(d){
  return ['J','B','p','i'].every(k=>Number.isFinite(d[k])&&d[k]>0&&d[k]<=1e10)&&Number.isFinite(d.M)&&d.M>=0&&d.M<=1e10&&d.i<=100;
}
function eoq(d){return Math.sqrt(200*d.J*d.B/(d.p*d.i));}
function costs(d,q,p=d.p){
  const n=d.J/q, stock=q/2+d.M, value=stock*p, holding=value*d.i/100, ordering=n*d.B, purchase=d.J*p;
  return {q,n,p,stock,value,holding,ordering,purchase,relevant:holding+ordering,total:holding+ordering+purchase};
}
const oilPrice=q=>8*(q>=20000?.85:q>=6000?.88:q>=4000?.9:1);
function oilOptimum(d){
  const tiers=[[0,4000,8],[4000,6000,7.2],[6000,20000,7.04],[20000,Infinity,6.8]];
  const candidates=tiers.flatMap(([min,max,p])=>{
    const q=Math.max(min,Math.min(d.J,eoq({...d,p})));
    return q>0&&q>=min&&q<max&&q<=d.J?[costs(d,q,p)]:[];
  });
  return candidates.sort((a,b)=>a.total-b.total)[0];
}
function shuffle(arr,random=Math.random){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function calculator(){const d=calcData;calcOutput=validateInputs(d)?{raw:eoq(d),q:Math.min(eoq(d),d.J)}:null;return head('ZUSAMMENHÄNGE VERSTEHEN','Das Rechenlabor.','Ändere die Werte und vergleiche Formel, Kostenkurven und Entscheidungstabelle.')+`<div class="calculator-layout"><form id="calculator-form" class="panel calc-form"><label class="preset-label">Beispiel<select id="calc-preset">${Object.entries(presets).map(([id,p])=>`<option value="${id}" ${preset===id?'selected':''}>${p.name}</option>`).join('')}</select></label><div class="form-grid">${[['J','Jahresbedarf J',d.unit],['B','Kosten je Bestellung B','€'],['p','Einstandspreis p',`€/${d.unit}`],['i','Lagerkostensatz i','% pro Jahr'],['M','Mindestbestand M',d.unit]].map(([id,label,unit])=>`<label>${label}<input type="text" inputmode="decimal" id="input-${id}" value="${String(d[id]).replace('.',',')}" required ${preset==='oil'&&id==='p'?'readonly':''}><span class="field-help">${unit}</span></label>`).join('')}</div>${button('Berechnen','calculate','type="submit"')}<p class="field-help">Dezimalzahlen mit Komma, z. B. 10,60. ${preset==='oil'?'Rabattstaffel: 10 % ab 4.000 l; 12 % ab 6.000 l; 15 % ab 20.000 l.':''}</p><div id="calc-error" class="error" role="alert"></div></form><div id="calc-results">${calcResults()}</div></div><section style="margin-top:28px"><div class="section-heading"><h2>Entscheidungstabelle</h2><span class="small muted">Kosten pro Jahr</span></div><div id="calc-table">${calcTable()}</div></section><details><summary>Formeln & Voraussetzungen</summary><div><p>q = J / n · Ø Bestand = q / 2 + M · Ø Wert = Ø Bestand × p</p><p>Bestellkosten = n × B · Lagerhaltungskosten = Ø Wert × i / 100</p><p>Relevante Kosten = Bestellkosten + Lagerhaltungskosten</p><p>Andler: q* = √((200 × J × B) / (p × i)), mit i als Prozentzahl. Es gelten gleichmäßiger bekannter Bedarf, feste Bestellkosten und konstanter Preis. Ein konstanter Mindestbestand erhöht die Kosten, verändert bei konstantem Preis aber nicht q*. Ganzzahlige Bestellhäufigkeiten und Rabatte werden separat verglichen.</p></div></details>`;}
function calcResults(){if(!calcOutput)return '';const d=calcData,q=calcOutput.q,c=costs(d,q);if(preset==='oil'){const rows=presets.oil.frequencies.map(n=>costs(d,d.J/n,oilPrice(d.J/n)));const best=rows.reduce((a,b)=>a.relevant<b.relevant?a:b);return `<div class="panel calc-results"><div class="eyebrow">MENGENRABATT · ENTSCHEIDUNGSTABELLE</div><h2>${fmt(best.q,2)} <small>${d.unit} je Bestellung</small></h2><p class="muted" style="margin-top:12px">Günstigste der in der Mappe vorgegebenen Bestellmengen nach jährlichen Bestell- und Lagerhaltungskosten.</p><div class="metric-row"><div><strong>${eur(best.relevant)}</strong><span>Summe der beiden Kostenarten</span></div><div><strong>${eur(best.p)}</strong><span>Preis pro Liter bei dieser Bestellmenge</span></div></div><p class="source-line">Die einfache Andler-Formel setzt einen konstanten Stückpreis voraus. Bei Rabatten vergleichst du hier die Zeilen der Entscheidungstabelle.</p></div>`;}

 const sq=sliderQ||Math.round(q),selected=costs(d,sq);return `<div class="panel calc-results"><div class="eyebrow">${calcOutput.raw>d.J?'OPTIMUM MIT JAHRESBEDARF ALS OBERGRENZE':'THEORETISCHE OPTIMALE BESTELLMENGE'}</div><h2>${fmt(q,2)} <small>${d.unit} je Bestellung</small></h2><div class="formula">√(200 × ${fmt(d.J)} × ${fmt(d.B,2)} / (${fmt(d.p,2)} × ${fmt(d.i)}))</div>${calcOutput.raw>d.J?`<p class="field-help">Die Formel liefert ${fmt(calcOutput.raw,2)} ${d.unit}. Hier vergleichen wir maximal einen Jahresbedarf je Bestellung.</p>`:''}<div class="metric-row"><div><strong>${fmt(c.n,2)}</strong><span>Bestellungen pro Jahr (rechnerisch)</span></div><div><strong>${eur(c.relevant)}</strong><span>Bestell- und Lagerkosten pro Jahr</span></div></div>${costChart(d,q)}<div class="chart-legend"><span>Summe</span><span class="ordering">Bestellkosten</span><span class="holding">Lagerkosten</span></div><label class="range-label">Andere Bestellmenge testen: <strong id="slider-value">${fmt(sq)} ${d.unit}</strong><input type="range" id="q-slider" min="${Math.max(1,Math.floor(q*.2))}" max="${Math.max(2,Math.min(d.J,Math.ceil(q*3)))}" step="1" value="${sq}"></label><p class="small muted" id="slider-cost">Bei dieser Menge: ${eur(selected.relevant)} pro Jahr.</p></div>`;}
function costChart(d,q){const width=600,height=230,pad={l:57,r:15,t:20,b:34},min=Math.max(1,q*.2),max=Math.min(d.J,q*3);const points=Array.from({length:71},(_,i)=>{const x=min+(max-min)*i/70;return costs(d,x);});const maxY=Math.max(...points.map(p=>p.relevant))*1.06;const X=x=>pad.l+(x-min)/(max-min||1)*(width-pad.l-pad.r),Y=y=>height-pad.b-y/maxY*(height-pad.t-pad.b);const path=k=>points.map((p,i)=>`${i?'L':'M'}${X(p.q).toFixed(1)},${Y(p[k]).toFixed(1)}`).join(' ');return `<svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Kostenkurven: Die Bestellkosten sinken, die Lagerkosten steigen. Die Summe hat ihr Minimum bei etwa ${fmt(q)} ${d.unit}.">${[0,.5,1].map(v=>`<line class="chart-grid" x1="${pad.l}" x2="${width-pad.r}" y1="${Y(maxY*v)}" y2="${Y(maxY*v)}"/><text x="${pad.l-8}" y="${Y(maxY*v)+4}" text-anchor="end">${fmt(maxY*v)}</text>`).join('')}<text x="${pad.l}" y="12">€ / Jahr</text>${[min,q,max].map(v=>`<text x="${X(v)}" y="${height-10}" text-anchor="middle">${fmt(v)}</text>`).join('')}<path d="${path('ordering')}" fill="none" stroke="#b3cbd6" stroke-width="2"/><path d="${path('holding')}" fill="none" stroke="#cbac81" stroke-width="2"/><path d="${path('relevant')}" fill="none" stroke="var(--accent)" stroke-width="3"/><line x1="${X(q)}" x2="${X(q)}" y1="25" y2="${height-pad.b}" stroke="var(--accent)" stroke-dasharray="3 6" opacity=".4"/><circle cx="${X(q)}" cy="${Y(costs(d,q).relevant)}" r="5" fill="var(--accent)"/></svg>`;}
function calcTable(){const d=calcData;if(!calcOutput)return '';let ns=presets[preset].frequencies;const rows=ns.map(n=>{const q=d.J/n;return costs(d,q,preset==='oil'?oilPrice(q):d.p);});const best=Math.min(...rows.map(r=>r.relevant));return `<div class="table-wrap" tabindex="0" aria-label="Entscheidungstabelle, bei Bedarf horizontal scrollen"><table><thead><tr><th>Bestellungen<br>pro Jahr</th><th>Menge<br>${d.unit}</th>${preset==='oil'?'<th>Preis<br>€/l</th>':''}<th>Ø Bestand<br>${d.unit}</th><th>Ø Wert<br>€</th><th>Lagerkosten<br>€</th><th>Bestellkosten<br>€</th><th>Summe<br>€</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r.relevant===best?'best':''}"><td>${fmt(r.n)}${r.relevant===best?' ✓':''}</td><td>${fmt(r.q,2)}</td>${preset==='oil'?`<td>${fmt(r.p,2)}</td>`:''}<td>${fmt(r.stock,2)}</td><td>${fmt(r.value,2)}</td><td>${fmt(r.holding,2)}</td><td>${fmt(r.ordering,2)}</td><td>${fmt(r.relevant,2)}</td></tr>`).join('')}</tbody></table></div><p class="field-help">✓ Minimum innerhalb dieser Tabellenalternativen. Die Summe enthält Bestell- und Lagerhaltungskosten. Zwischenwerte bleiben intern ungerundet; angezeigte Werte sind gerundet.</p>${preset==='oil'?'<div class="notice">Bei 12.000 l gelten 12 % Rabatt. Mit den Zahlen der Mappe ergeben sich Lagerkosten von 4.576 € und eine Kostensumme von 5.076 €.</div>':''}${preset==='hinges'?'<p class="field-help">Das Arbeitsblatt verlangt aufgerundete Stückzahlen. Hier zeigt der Vergleich zunächst exakte Modellwerte. Für die Abgabe Stückzahlen nach Aufgabenvorgabe aufrunden und die Folgekosten entsprechend neu berechnen.</p>':''}`;}

rium.</p><div class="rubric">${c.rubric.map((r,i)=>`<label class="check-label"><input type="checkbox" data-self="${id}-${i}" ${exam.self[id+'-'+i]?'checked':''} ${!String(exam.answers[id]||'').trim()?'disabled':''}>${r}</label>`).join('')}</div><details><summary>Mögliche Antwort</summary><p>${c.sample}</p></details></section>`;}).join('')}<div class="action-row">${button('Neue Probeklausur vorbereiten','reset-exam')}<a class="button secondary" href="#ueben">Gezielt weiterüben</a></div></div>`;}

});
document.addEventListener('input',e=>{
 if(e.target.id==='case-answer'){state.drafts[e.target.dataset.id]=e.target.value;save();}
 if(e.target.dataset.exam&&exam&&!exam.finished){exam.answers[e.target.dataset.exam]=e.target.value;saveExam();const counter=$('.exam-bar .muted');if(counter)counter.textContent=`${Object.values(exam.answers).filter(v=>String(v).trim()).length} / 14 bearbeitet`;}
 if(e.target.id==='q-slider'){sliderQ=Number(e.target.value);$('#slider-value').textContent=`${fmt(sliderQ)} ${calcData.unit}`;$('#slider-cost').textContent=`Bei dieser Menge: ${eur(costs(calcData,sliderQ).relevant)} pro Jahr.`;}
});
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||$('#info-dialog').open)return;if(route==='ueben'&&practiceTab==='quiz'&&quiz&&quiz.index<quiz.items.length&&/^[1-4]$/.test(e.key)){e.preventDefault();answerQuestion(quiz.items[quiz.index].order[Number(e.key)-1]);}if(route==='karten'&&deck&&!deck.reveal&&deck.index<deck.items.length&&e.code==='Space'){e.preventDefault();deck.reveal=true;render();}});
function theme(){state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;save();$('#theme-toggle').textContent=state.theme==='dark'?'Helle Darstellung':'Dunkle Darstellung';}
$('#theme-toggle').addEventListener('click',theme);
const mobileTheme=document.createElement('button');mobileTheme.className='mobile-theme';mobileTheme.textContent='Hell / Dunkel';mobileTheme.setAttribute('aria-label','Zwischen heller und dunkler Darstellung wechseln');mobileTheme.addEventListener('click',theme);$('.sidebar').append(mobileTheme);
$('.skip').addEventListener('click',e=>{e.preventDefault();$('#main').focus();$('#main').scrollIntoView();});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);$('#main').focus({preventScroll:true});});
render();
// Optional browser agent integration. The normal site works without WebMCP.
if(document.modelContext?.registerTool){
 const lifecycle=new AbortController();
 const tool={name:'start_brc_practice',title:'BRC Lernrunde starten',description:'Startet eine neue sichtbare Wissensrunde. Ersetzt eine eventuell laufende Übungsrunde; der gespeicherte Lernfortschritt bleibt erhalten.',inputSchema:{type:'object',properties:{topic:{type:'string',enum:['all','sourcing','lager','bestell']},count:{type:'integer',minimum:1,maximum:50}},required:['topic','count'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){
  if(!input||!['all','sourcing','lager','bestell'].includes(input.topic)||!Number.isInteger(input.count)||input.count<1||input.count>50||Object.keys(input).some(k=>!['topic','count'].includes(k)))throw new Error('Ungültiger Schwerpunkt oder Umfang.');
  if(exam&&!exam.finished)throw new Error('Eine Klausur läuft. Beende sie zuerst.');
  startQuiz(input.topic,input.count);render();return {started:true,count:quiz.items.length,topic:input.topic};
 }};
 try{Promise.resolve(document.modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});}catch{}
 window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});
}

  </script>
